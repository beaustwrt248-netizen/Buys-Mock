<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>B&L Morley Security Check</title>
  <style>
    html,body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{min-height:86px;display:flex;align-items:center;justify-content:center;padding:8px}
    #status{font-size:13px;color:#aaa;text-align:center;margin-top:6px}
    #status:empty{display:none;margin:0}
  </style>
</head>
<body>
<main><div><div id="challenge"></div><div id="status">Security check loading…</div></div></main>
<script>
(function(){
  const sitekey='0x4AAAAAAEZul-Qo6dqMim2U';
  const status=document.getElementById('status');
  const parentOrigin=window.location.origin;
  const postMessageOrigin=parentOrigin&&parentOrigin!=='null'?parentOrigin:'*';
  const MAX_API_ATTEMPTS=3;
  let apiAttempt=0;
  let apiWatchdog=0;
  let rendered=false;
  let loading=false;
  window.__morleyTurnstileToken='';
  window.__morleyTurnstileState='loading';

  function post(type,value,code){
    try{
      if(window.parent&&window.parent!==window){
        const payload={source:'morley-turnstile',type,value:value||'',code:code||''};
        window.parent.postMessage(payload,postMessageOrigin);
      }
    }catch(_){}
  }

  function send(name,value){
    const token=value||'';
    if(name==='onToken'){
      window.__morleyTurnstileToken=token;
      window.__morleyTurnstileState='complete';
    }else{
      window.__morleyTurnstileToken='';
      window.__morleyTurnstileState=name==='onExpired'?'expired':'error';
    }
    try{if(window.AndroidBridge&&typeof window.AndroidBridge[name]==='function')window.AndroidBridge[name](token);}catch(_){}
    const type=name==='onToken'?'token':name==='onExpired'?'expired':'error';
    post(type,token,'');
    if(name==='onToken'){
      setTimeout(()=>post(type,token,''),150);
      setTimeout(()=>post(type,token,''),600);
    }
  }

  function sendError(code){
    window.__morleyTurnstileToken='';
    window.__morleyTurnstileState='error';
    try{if(window.AndroidBridge&&typeof window.AndroidBridge.onError==='function')window.AndroidBridge.onError(String(code||''));}catch(_){}
    post('error','',String(code||''));
  }

  function fail(message,code){
    clearTimeout(apiWatchdog);
    loading=false;
    rendered=false;
    status.textContent=message||'Security check unavailable. Tap here to retry.';
    window.__morleyTurnstileState='error';
    post('bootstrap-error','',code||'api_unavailable');
  }

  function renderChallenge(){
    if(rendered||!window.turnstile)return;
    clearTimeout(apiWatchdog);
    loading=false;
    rendered=true;
    window.__morleyTurnstileState='ready';
    status.textContent='Complete the security check.';
    post('ready','','');
    try{
      window.turnstile.render('#challenge',{
        sitekey,
        theme:'dark',
        size:'flexible',
        action:'blmorley_auth',
        callback:function(token){status.textContent='';send('onToken',token);},
        'expired-callback':function(){status.textContent='Security check expired. Complete it again.';send('onExpired','');},
        'error-callback':function(code){
          status.textContent='Security check failed. Tap the message below to retry.';
          sendError(String(code||''));
          return true;
        }
      });
    }catch(error){
      rendered=false;
      retryApi('Security check failed to start. Retrying…');
    }
  }

  function retryApi(message){
    clearTimeout(apiWatchdog);
    loading=false;
    if(apiAttempt>=MAX_API_ATTEMPTS){
      fail('Security check unavailable. Tap here to retry.','api_unavailable');
      return;
    }
    status.textContent=message||'Security check loading…';
    const old=document.getElementById('morleyTurnstileApi');
    if(old)old.remove();
    loadApi();
  }

  function loadApi(){
    if(loading||rendered)return;
    loading=true;
    apiAttempt+=1;
    window.__morleyTurnstileState='loading';
    const script=document.createElement('script');
    script.id='morleyTurnstileApi';
    script.async=true;
    script.defer=true;
    script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    script.onload=function(){
      loading=false;
      if(window.turnstile)renderChallenge();
      else retryApi('Security check script loaded incompletely. Retrying…');
    };
    script.onerror=function(){loading=false;retryApi('Security check connection failed. Retrying…');};
    document.head.appendChild(script);
    apiWatchdog=setTimeout(function(){
      if(!window.turnstile&&!rendered){loading=false;retryApi('Security check is taking too long. Retrying…');}
    },5000);
  }

  status.addEventListener('click',function(){
    if(window.__morleyTurnstileState==='error'){
      apiAttempt=0;
      rendered=false;
      loading=false;
      window.__morleyTurnstileState='loading';
      retryApi('Retrying security check…');
    }
  });

  loadApi();
})();
</script>
</body>
</html>
