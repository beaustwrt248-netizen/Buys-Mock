<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>B&L Morley Security Check</title>
  <style>
    html,body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{min-height:86px;display:flex;align-items:center;justify-content:center;padding:8px}
    #status{font-size:13px;color:#aaa;text-align:center;margin-top:6px}
  </style>
</head>
<body>
<main><div><div id="challenge"></div><div id="status">Security check loading…</div></div></main>
<script>
(function(){
  const sitekey='0x4AAAAAAEZul-Qo6dqMim2U';
  const status=document.getElementById('status');
  const parentOrigin=window.location.origin;
  const postMessageOrigin=parentOrigin&&parentOrigin!=='null'?parentOrigin:'*';
  let rendered=false;
  let loading=false;
  window.__morleyTurnstileToken='';
  window.__morleyTurnstileState='idle';

  function post(type,value){
    try{
      if(window.parent&&window.parent!==window){
        const payload={source:'morley-turnstile',type,value:value||''};
        window.parent.postMessage(payload,postMessageOrigin);
      }
    }catch(_){}
  }

  function send(name,value){
    const token=value||'';
    if(name==='onToken'){
      window.__morleyTurnstileToken=token;
      window.__morleyTurnstileState='complete';
    }else{
      window.__morleyTurnstileToken='';
      window.__morleyTurnstileState=name==='onExpired'?'expired':'error';
    }
    try{if(window.AndroidBridge&&typeof window.AndroidBridge[name]==='function')window.AndroidBridge[name](token);}catch(_){}
    post(name==='onToken'?'token':name==='onExpired'?'expired':'error',token);
  }

  function fail(message,code){
    loading=false;
    status.textContent=message||'Security check unavailable. Tap here to retry.';
    window.__morleyTurnstileState='error';
    post('bootstrap-error',code||'api_unavailable');
  }

  function renderChallenge(){
    loading=false;
    if(rendered||!window.turnstile)return;
    rendered=true;
    window.__morleyTurnstileState='ready';
    status.textContent='Complete the security check.';
    post('ready','');
    try{
      window.turnstile.render('#challenge',{
        sitekey,
        theme:'dark',
        size:'flexible',
        action:'blmorley_auth',
        callback:function(token){status.textContent='Security check complete.';send('onToken',token);},
        'expired-callback':function(){status.textContent='Security check expired.';send('onExpired','');},
        'error-callback':function(code){status.textContent='Security check unavailable. Tap here to retry.';send('onError',String(code||''));return false;}
      });
    }catch(error){
      rendered=false;
      fail('Security check unavailable. Tap here to retry.','render_failed');
    }
  }

  function loadApi(){
    if(loading||rendered)return;
    loading=true;
    window.__morleyTurnstileState='loading';
    status.textContent='Security check loading…';
    const old=document.getElementById('morleyTurnstileApi');
    if(old)old.remove();
    const script=document.createElement('script');
    script.id='morleyTurnstileApi';
    script.async=true;
    script.defer=true;
    script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    script.onload=function(){window.turnstile?renderChallenge():fail('Security check unavailable. Tap here to retry.','api_incomplete');};
    script.onerror=function(){fail('Security check unavailable. Tap here to retry.','api_load_failed');};
    document.head.appendChild(script);
  }

  window.addEventListener('message',function(event){
    if(event.source!==window.parent)return;
    if(parentOrigin!=='null'&&event.origin!==parentOrigin)return;
    const payload=event.data;
    if(!payload||payload.source!=='morley-admin-login')return;
    if(payload.type==='start')loadApi();
  });

  status.addEventListener('click',function(){
    if(window.__morleyTurnstileState==='error'){
      rendered=false;
      loadApi();
    }
  });

  // Any real navigation to this page must start the challenge immediately.
  // Current Morley Admin keeps the iframe on about:blank until credentials are
  // ready, then navigates here with v=5&load. The native Morley Buys WebView
  // also navigates here directly, but its JavaScript bridge is not guaranteed
  // to be visible during the page's first synchronous script evaluation.
  // Default-on bootstrap therefore prevents native login from becoming inert
  // without weakening CAPTCHA: sign-in still requires a returned token.
  const params=new URLSearchParams(window.location.search);
  if(params.get('defer')==='1'){
    status.textContent='Enter your email and password first.';
    post('idle','');
  }else{
    loadApi();
  }
})();
</script>
</body>
</html>
