<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#040912">
  <title>Morley Admin Secure Session</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html,body{margin:0;min-height:100%;background:#040912;color:#f4f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    .status{max-width:320px;padding:24px;text-align:center;color:#8fa6c6}
  </style>
</head>
<body>
  <div id="status" class="status">Opening secure Admin workspace…</div>
  <script>
    (()=>{
      'use strict';
      const SUPABASE_URL='https://ghdhairijqjqivqriigi.supabase.co';
      const SUPABASE_KEY='sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt';
      const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      const params=new URLSearchParams(location.search);
      const adminApp=params.get('adminApp')||'0';
      const workspace=`/admin/?adminApp=${encodeURIComponent(adminApp)}&nativeAuth=1`;
      const status=document.getElementById('status');

      window.installNativeAdminSession=async(accessToken,refreshToken)=>{
        try{
          if(!accessToken||!refreshToken)throw new Error('Missing native Admin session.');
          const {data,error}=await sb.auth.setSession({access_token:String(accessToken),refresh_token:String(refreshToken)});
          if(error)throw error;
          if(!data?.session)throw new Error('Admin session could not be established.');
          const {data:verified,error:verifyError}=await sb.auth.getSession();
          if(verifyError)throw verifyError;
          if(!verified?.session)throw new Error('Admin session verification failed.');
          status.textContent='Session verified. Opening Admin…';
          location.replace(workspace);
          return true;
        }catch(error){
          status.textContent=error?.message||'Could not establish the Admin session.';
          return false;
        }
      };
    })();
  </script>
</body>
</html>
