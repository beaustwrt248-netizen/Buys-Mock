<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3ef"><title>B&L Morley Admin</title><link rel="stylesheet" href="styles.css?v=3"><link rel="stylesheet" href="auth-boundary.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="shell"><header class="topbar"><div><div class="eyebrow">B&L MORLEY</div><h1>Admin Control</h1></div><span class="badge">SECURE CONTROL CENTRE</span></header><section class="card auth-card"><h2>Opening Admin Control…</h2><div id="workspaceStatus" class="status" role="status" aria-live="polite">Verifying authorised session…</div></section></main><script>
(async()=>{'use strict';
const SUPABASE_URL='https://ghdhairijqjqivqriigi.supabase.co';
const SUPABASE_KEY='sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt';
const status=()=>document.getElementById('workspaceStatus');
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function fail(message){const node=status();if(node)node.textContent=message;setTimeout(()=>location.replace('./'),250);}
try{
  const {data:{session},error:sessionError}=await client.auth.getSession();
  if(sessionError||!session){fail(sessionError?.message||'Your Admin session has ended.');return;}
  const {data:profile,error:profileError}=await client.from('profiles').select('id,role,is_enabled').eq('id',session.user.id).single();
  if(profileError||!profile||!profile.is_enabled||!['admin','manager'].includes(profile.role)){await client.auth.signOut();fail(profileError?.message||'This account is not authorised for Admin Control.');return;}
  const response=await fetch(`workspace-template.html?v=2&t=${Date.now()}`,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!response.ok)throw new Error(`Admin workspace template returned HTTP ${response.status}`);
  const parsed=new DOMParser().parseFromString(await response.text(),'text/html');
  const shell=parsed.querySelector('main.shell');
  if(!shell)throw new Error('Admin workspace template is invalid.');
  document.body.replaceChildren(document.importNode(shell,true));
  document.getElementById('loginView')?.classList.add('hidden');
  document.getElementById('appView')?.classList.remove('hidden');
  const scripts=[
    ['adminUserPolicy','user-management-policy.js?v=3'],
    ['adminCoreApp','app.js?v=5'],
    ['adminAuthBoundary','auth-boundary.js?v=2'],
    ['adminReleaseControl','release-control.js?v=3'],
    ['adminTargetedNotifications','targeted-notifications.js?v=3'],
    ['adminInvites','invites.js?v=4'],
    ['adminDownloadInvites','download-invites.js?v=2'],
    ['adminSupportTickets','support-tickets.js?v=3'],
    ['adminAuditTriage','audit-triage.js?v=2'],
    ['adminPricingManagement','pricing-management.js?v=3'],
    ['adminV2Script','admin-v2.js?v=8'],
    ['adminControlGovernance','control-governance.js?v=2'],
    ['adminHome','admin-home.js?v=7']
  ];
  const loadScript=([id,src])=>new Promise((resolve,reject)=>{if(document.getElementById(id)){resolve();return;}const script=document.createElement('script');script.id=id;script.src=src;script.async=false;script.onload=resolve;script.onerror=()=>reject(new Error(`Failed to load ${src}`));document.body.appendChild(script);});
  for(const entry of scripts)await loadScript(entry);
  document.documentElement.dataset.adminWorkspace='ready';
}catch(error){fail(error?.message||'Admin workspace could not be opened.');}
})();
</script></body></html>
