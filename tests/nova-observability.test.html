<!doctype html><html><head><meta charset="utf-8"><title>Nova observability regression</title></head><body>
<section class="page" data-page="monitoring"><span id="monitorState">HEALTHY</span><strong id="monitorWorkflows">6</strong><strong id="monitorFailed">0</strong><div id="monitoringList"><small>9/9/2026, 10:10:00 am</small></div></section>
<span id="releaseOverall">READY</span><div id="releaseEvidence"><small>9/9/2026, 10:10:00 am</small></div><div id="releaseSummary">Exact main is green.</div>
<span id="guardianState">ENFORCED</span><strong id="guardianOpen">0</strong><div id="guardianEvidence"><small>9/9/2026, 10:10:00 am</small></div><div id="guardianBoundary">Human-controlled.</div>
<span id="connectionLabel">CONNECTED</span><span id="catalogueCheckedAt">2026-09-09T02:10:00Z</span><span id="catalogueNote">LIVE</span><span id="supportChecked">CURRENT</span><span id="supportSignal">healthy aggregate</span><span id="supportHigh">0</span><span id="memoryState">HEALTHY</span><span id="memoryRetention">retained</span>
<script src="../nova/observability.js"></script>
<script>
window.addEventListener('DOMContentLoaded',()=>{const failures=[];const ok=(v,m)=>{if(!v)failures.push(m)};const api=window.NovaObservability;
ok(!!api,'API installed');
ok(api.classifyFreshness('2026-09-09T01:00:00Z',60000,Date.parse('2026-09-09T02:00:00Z'))==='stale','stale evidence classified stale');
ok(api.classifyFreshness(null)==='unknown','missing timestamp is unknown');
ok(api.normalizeRecord({status:'HEALTHY',checkedAt:'2026-09-09T01:00:00Z',maxAgeMs:60000,now:Date.parse('2026-09-09T02:00:00Z')}).status==='stale','stale healthy signal cannot stay healthy');
ok(api.aggregate([{status:'HEALTHY'},{status:'DEGRADED'},{status:'UNKNOWN'}]).status==='degraded','worst verified state wins');
ok(api.aggregate([]).status==='unknown','empty evidence is unknown');
const guarded=api.normalizeRecord({id:'guardian',status:'ENFORCED',protected:true,nextAction:'Review only'});ok(guarded.protected===true,'protected boundary retained');ok(!('execute' in guarded),'record exposes no execution hook');
ok(!!document.getElementById('novaObservability'),'unified observability card installed');ok(document.querySelectorAll('#novaObservability').length===1,'card installed once');
const backup=api.collect().find(x=>x.id==='backup');ok(backup&&backup.status==='unknown','missing backup evidence is unknown, never healthy');
const result=document.createElement('pre');result.id='testResult';result.textContent=failures.length?'FAIL\n'+failures.join('\n'):'PASS';document.body.appendChild(result);if(failures.length)throw new Error(result.textContent)});
</script></body></html>
