<!doctype html><meta charset="utf-8"><title>Nova knowledge engine tests</title><script src="../nova/knowledge-engine.js"></script><script>
(async()=>{const assert=(v,m)=>{if(!v)throw new Error(m)};const kb=new NovaKnowledgeEngine({maxChunkChars:120,overlapChars:20});const a=await kb.ingestText({name:'Pricing Rules',authority:'internal-approved',text:'Australian pricing changes require evidence. Manufacturer data is preferred for device identity. Protected actions remain approval gated.'});assert(a.chunks>0,'source should chunk');const b=await kb.ingestText({name:'Manual',authority:'manufacturer',text:'Model ABC-123 supports 256GB storage. The model identifier is ABC-123.'});assert(kb.list().length===2,'two sources expected');const hits=kb.search('ABC-123 256GB');assert(hits.length&&hits[0].source==='Manual','manufacturer manual should retrieve');const ctx=kb.context('pricing evidence');assert(ctx.warning.includes('not permission'),'guardrail warning required');const conflicts=kb.detectConflicts('model');assert(Array.isArray(conflicts.authorities),'conflict result expected');assert(kb.remove(b.id),'remove should succeed');assert(kb.list().length===1,'remove should update source count');document.body.textContent='PASS — Nova knowledge engine';})().catch(e=>{document.body.textContent='FAIL — '+e.message;throw e});
</script>
