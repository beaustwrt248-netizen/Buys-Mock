stages:
  - validate
  - test
  - security
  - build
  - release-check

include:
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/quality.yml
  - local: .gitlab/ci/governance.yml
  - local: .gitlab/ci/repository-path-stability.yml
  - local: .gitlab/ci/android.yml
  - local: .gitlab/ci/admin.yml
  - local: .gitlab/ci/release.yml

# GitLab.com hosted-runner profile for Android/Gradle parity jobs. The image is
# intentionally generic and the exact toolchain is pinned here so the migration
# does not depend on a user-managed runner or silently drift from GitHub CI.
.android-hosted-job: &android_hosted_job
  tags:
    - saas-linux-medium-amd64
  image: ghcr.io/cirruslabs/android-sdk:tools
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq openjdk-17-jdk-headless python3 xz-utils ca-certificates >/dev/null
      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      export PATH="$JAVA_HOME/bin:$PATH"

      ANDROID_TOOLS_BUILD=14742923
      rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest" /tmp/android-cmdline-tools
      mkdir -p /tmp/android-cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      curl -fsSLo /tmp/android-commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_TOOLS_BUILD}_latest.zip"
      unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-cmdline-tools
      cp -a /tmp/android-cmdline-tools/cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      GRADLE_VERSION=9.3.1
      curl -fsSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
      rm -rf "/opt/gradle-${GRADLE_VERSION}"
      unzip -q /tmp/gradle.zip -d /opt
      ln -sf "/opt/gradle-${GRADLE_VERSION}/bin/gradle" /usr/local/bin/gradle

      NODE_VERSION=22.23.2
      curl -fsSLo /tmp/node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
      rm -rf "/opt/node-v${NODE_VERSION}-linux-x64"
      tar -xJf /tmp/node.tar.xz -C /opt
      ln -sf "/opt/node-v${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/node
      ln -sf "/opt/node-v${NODE_VERSION}-linux-x64/bin/npm" /usr/local/bin/npm
      ln -sf "/opt/node-v${NODE_VERSION}-linux-x64/bin/npx" /usr/local/bin/npx

      java -version
      gradle --version
      node --version
      python3 --version
      sdkmanager --list_installed | grep -E 'platforms;android-37\.0|build-tools;37\.0\.0|platform-tools'

# Override only runner/toolchain keys. Scripts, rules, artifacts and protected
# release boundaries remain defined by their included parity jobs.
admin:android-check:
  <<: *android_hosted_job

admin:recovery-apk:
  <<: *android_hosted_job

admin:apk-build:
  <<: *android_hosted_job

android:build-apk:
  <<: *android_hosted_job

android:nova-apk-build:
  <<: *android_hosted_job

security:android-pr-readonly:
  <<: *android_hosted_job

test:nova-next-ci:
  <<: *android_hosted_job

test:ultimate-parity:
  <<: *android_hosted_job

# Same read-only contract as the newly merged GitHub workflow. Keeping this job
# required preserves exact parity rather than weakening the manifest entry.
governance:nova-next-route-password-accessibility:
  stage: test
  image: node:22-bookworm
  script:
    - node --test tests/nova-next-route-password-accessibility.test.mjs

# The dedicated governance:ui-pr-checklist job fetches the complete merge-request
# description through GitLab's read-only Merge Requests API. Override the included
# UI consistency job here so it does not run the legacy GitHub-event adapter with
# GitLab's truncated CI_MERGE_REQUEST_DESCRIPTION variable.
test:ui-consistency:
  extends: .node-python-job
  script:
    - node --check morley-ui-baseline.js
    - node --check mobile-readability-fix.js
    - node --check web-initial-render-fix.js
    - python3 scripts/ui_consistency_audit.py

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
