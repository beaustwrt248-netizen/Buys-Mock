stages:
  - validate
  - test
  - security
  - build
  - release-check

include:
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/android.yml
  - local: .gitlab/ci/admin.yml
  - local: .gitlab/ci/release.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
