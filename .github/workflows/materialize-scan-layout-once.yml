name: Materialize Scan Layout Once
on:
  push:
    branches: [feature/morley-buys-scan-layout-20260914]
    paths:
      - android/cleanup_scan_result_once.py
      - .github/workflows/materialize-scan-layout-once.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/morley-buys-scan-layout-20260914
      - name: Remove duplicate scanner action
        run: python3 android/cleanup_scan_result_once.py
      - name: Commit scanner cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/buysloans/hub/DeviceLensActivity.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected scanner cleanup'; exit 1; }
          git commit -m "fix: remove duplicate scan compare action"
          git push origin HEAD:feature/morley-buys-scan-layout-20260914
