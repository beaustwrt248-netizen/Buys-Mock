name: Nova Knowledge Maintenance Contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/functions/nova-knowledge-maintenance/**'
      - 'supabase/functions/nova-knowledge-ingest/**'
      - 'supabase/functions/_shared/nova_internal_ingestion.mjs'
      - 'supabase/migrations/*nova_knowledge_maintenance*.sql'
      - 'tests/nova_knowledge_ingest_contract.test.mjs'
      - 'tests/nova_knowledge_maintenance_contract.test.mjs'
      - 'tests/nova_knowledge_maintenance_hardening_contract.test.mjs'
      - '.github/workflows/nova-knowledge-maintenance-contract.yml'
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/nova-knowledge-maintenance/**'
      - 'supabase/functions/nova-knowledge-ingest/**'
      - 'supabase/functions/_shared/nova_internal_ingestion.mjs'
      - 'supabase/migrations/*nova_knowledge_maintenance*.sql'
      - 'tests/nova_knowledge_ingest_contract.test.mjs'
      - 'tests/nova_knowledge_maintenance_contract.test.mjs'
      - 'tests/nova_knowledge_maintenance_hardening_contract.test.mjs'
      - '.github/workflows/nova-knowledge-maintenance-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Nova knowledge maintenance contracts
        run: |
          node --test tests/nova_knowledge_ingest_contract.test.mjs
          node --test tests/nova_knowledge_maintenance_contract.test.mjs
          node --test tests/nova_knowledge_maintenance_hardening_contract.test.mjs
