name: Repository Path Stability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-path-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify canonical repository paths
        run: node scripts/ci/check-repository-path-stability.mjs
      - name: Verify OTA release provenance contracts
        run: |
          node --test \
            tests/morley-ota-release-provenance.test.mjs \
            tests/nova-next-ota-release-provenance.test.mjs \
            tests/admin-ota-release-provenance.test.mjs
