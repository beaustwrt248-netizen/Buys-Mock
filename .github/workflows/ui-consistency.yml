name: Morley UI Consistency

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'android/app/src/main/java/com/buysloans/hub/**'
      - 'scripts/ui_consistency_audit.py'
      - 'scripts/ui_pr_checklist_gate.py'
      - '.github/pull_request_template.md'
      - '.github/workflows/ui-consistency.yml'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'android/app/src/main/java/com/buysloans/hub/**'
      - 'scripts/ui_consistency_audit.py'
      - 'scripts/ui_pr_checklist_gate.py'
      - '.github/pull_request_template.md'
      - '.github/workflows/ui-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce UI and mobile-web theme full-sweep policy
        if: github.event_name == 'pull_request'
        run: python3 scripts/ui_pr_checklist_gate.py
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check morley-ui-baseline.js
          node --check mobile-readability-fix.js
          node --check web-initial-render-fix.js
      - name: Presentation contract audit
        run: python3 scripts/ui_consistency_audit.py
