name: B&L Morley Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release readiness audit
        run: python3 scripts/release_audit.py

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app.js \
            global-device-filter.js \
            match-quality.js \
            workflow.js \
            desktop-oem.js \
            oem-live-fix.js \
            oem-row-guard.js \
            desktop-results.js \
            deal-workflow.js \
            dashboard-cleanup.js \
            quick-deal-grade.js \
            reliability-polish.js \
            desktop-parity.js \
            web-auth.js \
            signed-in-user.js \
            premium-motion.js \
            web-a11y.js \
            ultimate-parity.js \
            product-parity-v3.js \
            admin/app.js \
            admin/guardian.js \
            admin/guardian-health.js \
            admin/invites.js \
            admin/download-invites.js \
            admin/targeted-notifications.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Guardian runtime regression coverage
        run: node --test tests/guardian-runtime-regression.test.js

      - name: Verify Android light palette transform with Morley emerald contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile android/apply_morley_brand_palette.py
          python3 android/apply_morley_brand_palette.py
          if grep -RInE '0xFFFFD400|0xFFC99A27|0xFFDDB347|0xFF2F7CFF|0xFF12C9FF' android/app/src/main/java/com/buysloans/hub --include='*.kt'; then
            echo 'Retired Android gold/blue/cyan token remains after Morley palette transform'
            exit 1
          fi
          grep -q '0xFF167A5A' android/app/src/main/java/com/buysloans/hub/MorleyVisualTheme.kt
          grep -q '0xFFF5F7F4' android/app/src/main/java/com/buysloans/hub/MorleyVisualTheme.kt
          grep -q '0xFFFFFFFF' android/app/src/main/java/com/buysloans/hub/MorleyVisualTheme.kt
          grep -q '0xFF1C2B26' android/app/src/main/java/com/buysloans/hub/MorleyVisualTheme.kt
          grep -q 'lightColorScheme' android/app/src/main/java/com/buysloans/hub/MorleyVisualTheme.kt
          grep -q 'CATEGORIES("Categories", MorleyIcons.Categories)' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'GP("General Buys", MorleyIcons.Money)' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'General Buys / GP' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'Page.Laptop -> CategoriesPricingScreen()' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'Page.Desktop -> ConsolePricingScreen()' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'val adaptiveSize = morleyAdaptiveSize()' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'AdaptiveBackHandler(enabled = showMenu || page != Page.Home)' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'MorleyAdaptiveNavigation(size = adaptiveSize, items = adaptiveNavItems, compact = {})' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'AdaptiveContentFrame' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          if grep -q 'NavCard(MorleyIcons.Categories' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt; then
            echo 'Categories shortcut must not return to Home'
            exit 1
          fi
          if grep -q 'NavCard(MorleyIcons.Console' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt; then
            echo 'Console Pricing shortcut must not return to Home'
            exit 1
          fi
          grep -q 'MobilePhonePricingScreen()' android/app/src/main/java/com/buysloans/hub/CategoriesPricingScreen.kt
          grep -q 'SAMSUNG(MobilePhonePricingCatalog.SAMSUNG' android/app/src/main/java/com/buysloans/hub/MobilePhonePricingScreen.kt
          grep -q 'AuthManager.validAccessToken(MorleyApplication.instance)' android/app/src/main/java/com/buysloans/hub/MainActivity.kt
          grep -q 'setRequestProperty("Authorization","Bearer $token")' android/app/src/main/java/com/buysloans/hub/MainActivity.kt
          grep -q 'AuthManager.accountLabel(context)' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'fun accountLabel' android/app/src/main/java/com/buysloans/hub/AuthManager.kt
          grep -q 'itemGrade = grade' android/app/src/main/java/com/buysloans/hub/SmartWorkspaceSection.kt
          grep -q 'put("item_grade",it)' android/app/src/main/java/com/buysloans/hub/ValuationHistoryManager.kt
          find android/app/src/main/java/com/buysloans/hub -name '*.kt' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/palette-before.sha"
          python3 android/apply_morley_brand_palette.py
          find android/app/src/main/java/com/buysloans/hub -name '*.kt' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/palette-after.sha"
          diff -u "$RUNNER_TEMP/palette-before.sha" "$RUNNER_TEMP/palette-after.sha"

      - name: Verify Android auth routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AuthActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'AuthManager.validAccessToken(this@AuthActivity)' android/app/src/main/java/com/buysloans/hub/AuthActivity.kt
          grep -q 'AuthManager.isSignedIn(this)' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          grep -q 'AuthManager.accountLabel(context)' android/app/src/main/java/com/buysloans/hub/DashboardActivity.kt
          if grep -RInE 'AuthManager\.signIn\([^,]+,[^,]+,[^,]+\)' android/app/src/main/java/com/buysloans/hub --include='*.kt'; then
            echo 'Legacy non-CAPTCHA Android sign-in call remains in production code'
            exit 1
          fi

      - name: Verify Android release signing policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q "tasks.register('verifyReleaseSigning')" android/app/build.gradle
          grep -q "preReleaseBuild" android/app/build.gradle
          grep -q "B_AND_L_KEYSTORE_PATH" android/app/build.gradle
          grep -q "B_AND_L_STORE_PASSWORD" android/app/build.gradle
          grep -q "B_AND_L_KEY_ALIAS" android/app/build.gradle
          if grep -q 'signingConfigs\.debug' android/app/build.gradle; then
            echo 'Release build must never fall back to the Android debug signing key'
            exit 1
          fi
          grep -q 'EXPECTED_CERT_SHA256=' .github/workflows/build-apk.yml
          grep -q 'Verify release APK signature and signer' .github/workflows/build-apk.yml

      - name: Verify protected backend endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ghdhairijqjqivqriigi.supabase.co/functions/v1'
          assert_protected() {
            local endpoint="$1" body="$2" code
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/${endpoint}.json" --write-out '%{http_code}' --max-time 20 \
              -X POST "$BASE/$endpoint" -H 'Content-Type: application/json' --data "$body")"
            if [ "$code" != '401' ]; then
              echo "$endpoint accepted or mishandled an unauthenticated request (HTTP $code)"
              cat "$RUNNER_TEMP/${endpoint}.json" || true
              exit 1
            fi
          }
          assert_protected ebay-search '{"query":"RTX 4070","limit":5}'
          assert_protected oem-search '{"query":"Dell OptiPlex 7090"}'
          assert_protected send-admin-notification '{"job_id":"00000000-0000-0000-0000-000000000000"}'
          assert_protected admin-user-control '{"action":"set_display_name","target_user_id":"00000000-0000-0000-0000-000000000000","display_name":"Test User"}'

      - name: Validate OTA JSON
        run: python3 -m json.tool ota/latest.json >/dev/null

      - name: Validate login video archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP=morley_buys_login_bg_app_hq.zip
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app.zip; fi
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -Ei '\.mp4$' >/dev/null

      - name: Verify web shell references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'reference-theme.css' index.html
          grep -q 'morley-light-web.css' index.html
          grep -q 'no-gold.css' index.html
          grep -q 'web-auth.js' index.html
          grep -q 'signed-in-user.js' index.html
          grep -q 'premium-motion.js' index.html
          grep -q 'web-a11y.js' index.html
          grep -q 'quick-deal-grade.js' index.html
          grep -q 'ultimate-parity.js' index.html
          grep -q 'product-parity-v3.js' index.html
