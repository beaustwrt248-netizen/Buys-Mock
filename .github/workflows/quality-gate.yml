name: B&L Morley Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release readiness audit
        run: python3 scripts/release_audit.py

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app.js \
            global-device-filter.js \
            match-quality.js \
            workflow.js \
            desktop-oem.js \
            oem-live-fix.js \
            oem-row-guard.js \
            desktop-results.js \
            deal-workflow.js \
            dashboard-cleanup.js \
            reliability-polish.js \
            desktop-parity.js \
            web-auth.js \
            signed-in-user.js \
            premium-motion.js \
            web-a11y.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Verify Android cyber palette transform
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile android/apply_cyber_palette.py
          python3 android/apply_cyber_palette.py
          # The build-time transform must remove the retired gold palette and old charcoal surfaces.
          if grep -RInE '0xFFFFD400|0xFFC99A27|0xFFDDB347' android/app/src/main/java/com/buysloans/hub --include='*.kt'; then
            echo 'Retired Android gold token remains after cyber palette transform'
            exit 1
          fi
          grep -q 'Laptop Intelligence' android/app/src/main/java/com/buysloans/hub/MainActivity.kt
          grep -q '0xFF2F7CFF' android/app/src/main/java/com/buysloans/hub/MainActivity.kt
          grep -q '0xFF12C9FF' android/app/src/main/java/com/buysloans/hub/MainActivity.kt
          # Prove the transformer is idempotent so repeated CI builds cannot keep changing source.
          find android/app/src/main/java/com/buysloans/hub -name '*.kt' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/palette-before.sha"
          python3 android/apply_cyber_palette.py
          find android/app/src/main/java/com/buysloans/hub -name '*.kt' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/palette-after.sha"
          diff -u "$RUNNER_TEMP/palette-before.sha" "$RUNNER_TEMP/palette-after.sha"

      - name: Validate OTA JSON
        run: python3 -m json.tool ota/latest.json >/dev/null

      - name: Validate login video archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP=morley_buys_login_bg_app_hq.zip
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app.zip; fi
          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -Ei '\.mp4$' >/dev/null

      - name: Verify web shell references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'reference-theme.css' index.html
          grep -q 'no-gold.css' index.html
          grep -q 'web-auth.js' index.html
          grep -q 'signed-in-user.js' index.html
          grep -q 'premium-motion.js' index.html
          grep -q 'web-a11y.js' index.html
