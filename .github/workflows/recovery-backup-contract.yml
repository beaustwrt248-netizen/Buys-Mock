name: Recovery Backup Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-backup-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: user-drive-backup-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reachability-only contract
        run: node --test --test-name-pattern='reachability verification' tests/user-drive-backup-contract.test.mjs
      - name: Verify complete encrypted Drive backup contract
        run: node --test tests/user-drive-backup-contract.test.mjs
