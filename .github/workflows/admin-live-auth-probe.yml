name: Admin Live Auth Probe

on:
  pull_request:
    paths:
      - '.github/workflows/admin-live-auth-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace buyshub.me Admin startup
        shell: bash
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';

          const target='https://buyshub.me/admin/';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          page.on('request',req=>console.log(`REQ=${req.resourceType()} ${req.url()}`));
          page.on('response',res=>console.log(`RES=${res.status()} ${res.url()}`));
          page.on('requestfailed',req=>console.log(`FAIL=${req.url()} :: ${req.failure()?.errorText||'failed'}`));
          page.on('console',msg=>console.log(`CONSOLE=${msg.type()} ${msg.text()}`));
          page.on('pageerror',err=>console.log(`PAGEERROR=${err.message}`));

          try {
            const response=await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
            console.log(`ADMIN_HTTP=${response?.status()||0}`);
            console.log(`ADMIN_URL=${page.url()}`);
            console.log('DOMCONTENTLOADED=1');
            await new Promise(resolve=>setTimeout(resolve,12000));
            const frameUrls=page.frames().map(frame=>frame.url());
            console.log(`FRAME_URLS=${JSON.stringify(frameUrls)}`);
          } catch(error){
            console.log(`PROBE_ERROR=${error?.stack||error}`);
          } finally {
            await Promise.race([
              browser.close().catch(()=>{}),
              new Promise(resolve=>setTimeout(resolve,3000))
            ]);
          }
          EOF
          set +e
          timeout 50s node probe.mjs 2>&1 | tee "$RUNNER_TEMP/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ]; then echo 'PROBE_ERROR=browser probe timed out' | tee -a "$RUNNER_TEMP/probe.log"; fi
          if ! grep -q 'ADMIN_HTTP=200' "$RUNNER_TEMP/probe.log"; then
            echo '::error::Live Admin page did not return HTTP 200.'
            exit 1
          fi
          if grep -Eq '110200|Domain not authorized|Invalid sitekey|110100|110110|400020|400070' "$RUNNER_TEMP/probe.log"; then
            echo '::error::Turnstile configuration failure detected on the live custom domain.'
            exit 1
          fi
          if [ "$rc" -ne 0 ] || grep -q 'PROBE_ERROR=' "$RUNNER_TEMP/probe.log"; then
            echo '::error::Live Admin renderer/startup did not remain responsive.'
            exit 1
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-live-auth-probe
          path: ${{ runner.temp }}/probe.log
          if-no-files-found: warn
