name: Guardian Platform Check

on:
  pull_request:
    paths:
      - 'admin/guardian-*.js'
      - 'supabase/functions/guardian-sensitive-readiness/**'
      - 'tests/guardian-platform.test.cjs'
      - '.github/workflows/guardian-platform-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check admin/guardian-platform.js
          node --check admin/guardian-live.js
          node --check admin/guardian-domain-telemetry.js
      - name: Guardian policy regression tests
        run: node tests/guardian-platform.test.cjs
      - name: Protected boundary assertions
        run: |
          grep -q "Protected boundary detected" admin/guardian-platform.js
          grep -q "missing telemetry must not be reported healthy" tests/guardian-platform.test.cjs
          grep -qi "final merge remains human-controlled" admin/guardian-repairs.js
          grep -q "sensitive domains use authenticated aggregate endpoints" admin/guardian-domain-telemetry.js
          grep -q "\['admin','manager'\]" supabase/functions/guardian-sensitive-readiness/index.ts
          grep -q "raw_evidence_exposed:false" supabase/functions/guardian-sensitive-readiness/index.ts
          grep -q "raw_prices_exposed:false" supabase/functions/guardian-sensitive-readiness/index.ts
          grep -q "raw_user_backups_exposed:false" supabase/functions/guardian-sensitive-readiness/index.ts
          grep -q "authority_expansion:false" supabase/functions/guardian-sensitive-readiness/index.ts
