name: Admin Support Governance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'admin/**'
      - 'supabase/migrations/*support*'
      - '.github/workflows/admin-support-governance.yml'
  push:
    branches: [ main ]
    paths:
      - 'admin/**'
      - 'supabase/migrations/*support*'
      - '.github/workflows/admin-support-governance.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate admin support JavaScript
        run: |
          node --check admin/support-tickets.js
          node --check admin/staff-support.js
      - name: Verify support ownership, SLA and staff-role contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('supabase/migrations/20260827173000_support_ticket_system.sql').read_text()
          sla = Path('supabase/migrations/20260827212500_support_assignment_sla.sql').read_text()
          staff = Path('supabase/migrations/20260827231000_support_staff_assigned_access.sql').read_text()
          admin = Path('admin/support-tickets.js').read_text()
          staff_ui = Path('admin/staff-support.js').read_text()
          staff_html = Path('admin/staff.html').read_text()
          required_base = [
              'user_id = auth.uid() or private.is_admin_or_manager()',
              "user_id = auth.uid() and status = 'open' and priority = 'normal' and assigned_to is null",
              'private.is_admin_or_manager()) with check (private.is_admin_or_manager())',
              'file_size_limit,allowed_mime_types',
              "10485760,array['image/jpeg','image/png','image/webp','application/pdf']",
          ]
          for needle in required_base:
              if needle not in base:
                  raise SystemExit(f'Existing support ownership/attachment contract missing: {needle}')
          required_sla = [
              'add column if not exists sla_due_at timestamptz',
              'add column if not exists first_response_at timestamptz',
              "when 'urgent' then interval '2 hours'",
              "when 'high' then interval '8 hours'",
              "else interval '24 hours'",
              'support_mark_first_response',
          ]
          for needle in required_sla:
              if needle not in sla:
                  raise SystemExit(f'SLA migration contract missing: {needle}')
          if 'disable row level security' in sla.lower():
              raise SystemExit('SLA increment must not disable existing support RLS policies')
          required_staff = [
              'create or replace function private.is_support_staff()',
              "p.role = 'staff'",
              'private.is_support_staff() and assigned_to = auth.uid()',
              'private.can_work_support_ticket(ticket_id)',
              "bucket_id = 'support-ticket-attachments'",
              "t.user_id = auth.uid()",
              'private.is_admin_or_manager()',
          ]
          for needle in required_staff:
              if needle not in staff:
                  raise SystemExit(f'Assigned-staff support contract missing: {needle}')
          forbidden_staff = [
              'alter table public.support_tickets disable row level security',
              'grant all on public.support_tickets',
              'to anon',
          ]
          for needle in forbidden_staff:
              if needle in staff.lower():
                  raise SystemExit(f'Unsafe staff support grant detected: {needle}')
          required_admin_ui = [
              'ticketAssignee',
              'assigned_to',
              'sla_due_at',
              'first_response_at',
              ".in('role',['admin','manager','staff'])",
              'sb.auth.getUser()',
              'author_user_id:actor',
          ]
          for needle in required_admin_ui:
              if needle not in admin:
                  raise SystemExit(f'Admin support UI contract missing: {needle}')
          required_staff_ui = [
              "p.role!=='staff'",
              ".eq('assigned_to',me.id)",
              "author_user_id:me.id",
              "author_role:'admin'",
              "const staffWritableStatuses=new Set(['in_progress','waiting_on_user','resolved'])",
              "update({status}).eq('id',currentTicket.id).eq('assigned_to',me.id)",
              'No tickets are currently assigned to you.',
          ]
          for needle in required_staff_ui:
              if needle not in staff_ui:
                  raise SystemExit(f'Staff support UI contract missing: {needle}')
          forbidden_staff_ui = [
              'assigned_to:',
              "from('profiles').select('*')",
              'admin_set_config',
              'admin-user-control',
              'notification_jobs',
              "updates={status:$('ticketStatus').value,priority:$('ticketPriority').value}",
              'update({status,priority',
              'update({priority',
          ]
          for needle in forbidden_staff_ui:
              if needle in staff_ui:
                  raise SystemExit(f'Staff support UI must not expose privileged Admin controls: {needle}')
          for needle in ['ASSIGNED TICKETS ONLY','My assigned tickets','staff-support.js?v=2','login-security.js?v=1']:
              if needle not in staff_html:
                  raise SystemExit(f'Staff support page contract missing: {needle}')
          print('Support ownership, attachments, assignment, SLA and status-only assigned-staff UI/RLS contracts OK')
          PY
