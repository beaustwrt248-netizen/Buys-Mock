name: Nova PR Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  nova-guard:
    if: startsWith(github.head_ref, 'nova/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/nova-files.txt
          cat /tmp/nova-files.txt

          protected=0
          while IFS= read -r file; do
            case "$file" in
              supabase/migrations/*|supabase/functions/*|android/app/src/main/AndroidManifest.xml|android/app/build.gradle|.github/workflows/*)
                protected=1
                ;;
            esac

            lower="$(printf '%s' "$file" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *auth*|*permission*|*role*|*pricing*approval*|*guardian*policy*|*security*boundary*)
                protected=1
                ;;
            esac
          done < /tmp/nova-files.txt

          echo "protected=$protected" >> "$GITHUB_OUTPUT"

      - name: Require owner approval for high-risk paths
        if: steps.classify.outputs.protected == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: beaustwrt248-netizen
        shell: bash
        run: |
          set -euo pipefail
          approvals="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '[.[] | select(.user.login == env.OWNER and .state == "APPROVED")] | length')"
          if [ "$approvals" -lt 1 ]; then
            echo "Nova touched a protected/high-risk area. Repository-owner approval is required before this PR can pass the Nova guard."
            exit 1
          fi

      - name: Confirm guarded change
        if: steps.classify.outputs.protected != '1'
        run: echo "Nova change does not touch a path classified as high risk by the repository guard."
