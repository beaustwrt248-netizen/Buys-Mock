name: Nova PR Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  nova-guard:
    if: startsWith(github.event.pull_request.head.ref, 'nova/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify Nova change
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/nova-files.txt
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/nova.diff
          cat /tmp/nova-files.txt

          python3 - <<'PY'
          import os, re
          from pathlib import Path
          files=Path('/tmp/nova-files.txt').read_text().splitlines()
          diff=Path('/tmp/nova.diff').read_text(errors='replace')
          added='\n'.join(l[1:] for l in diff.splitlines() if l.startswith('+') and not l.startswith('+++'))

          guarded=[]
          critical=[]
          guarded_path=re.compile(r'^supabase/(migrations|functions)/|^\.github/workflows/|AndroidManifest\.xml$|build\.gradle$|auth|permission|role|pricing.*approval|guardian.*policy|security.*boundary', re.I)
          critical_path=re.compile(r'(^|/)\.env($|\.)|credential|private[-_]?key|keystore|signing|\.(jks|keystore|p12|pfx|pem|key)$', re.I)
          for f in files:
              if guarded_path.search(f): guarded.append(f)
              if critical_path.search(f): critical.append(f)

          critical_patterns=[
              r'\bdisable\s+row\s+level\s+security\b',
              r'\bgrant\s+all\b.*\b(to|role)\s+(anon|authenticated|public)\b',
              r'\bservice[_-]?role\b',
              r'\bdrop\s+(table|schema|database)\b',
              r'\btruncate\b',
              r'authority_expansion\s*[:=]\s*true',
              r'raw_(evidence|prices|user_backups)_exposed\s*[:=]\s*true',
          ]
          for p in critical_patterns:
              if re.search(p, added, re.I|re.M): critical.append('diff:'+p)

          level='critical' if critical else ('guarded' if guarded else 'routine')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'level={level}\n')
              out.write('critical<<EOF\n'+'\n'.join(critical)+'\nEOF\n')
          print('Nova risk:', level)
          PY

      - name: Stop only critical Nova trust/destructive changes
        if: steps.classify.outputs.level == 'critical'
        shell: bash
        run: |
          echo 'Nova touched a critical trust, credential/signing, or destructive-production boundary.'
          echo '${{ steps.classify.outputs.critical }}'
          echo 'Morley Autopilot intentionally fails closed here.'
          exit 1

      - name: Confirm autonomous Nova change
        if: steps.classify.outputs.level != 'critical'
        run: |
          echo "Nova change classified as ${{ steps.classify.outputs.level }}."
          echo 'Existing required security, quality, parity, Guardian and release checks remain authoritative.'
          echo 'No conversational approval is required for this non-critical change.'
