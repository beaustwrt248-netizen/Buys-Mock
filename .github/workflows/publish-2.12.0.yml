name: Publish B&L Morley 2.14.0 production

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-2.12.0.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true
      - name: Record publisher generation
        run: echo "publisher=2.14.0-production"
