name: Morley AI Assessment Core

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'morley-ai-assessment-core.js'
      - 'android/app/src/main/java/com/buysloans/hub/DeviceLensActivity.kt'
      - 'android/app/src/main/java/com/buysloans/hub/MorleyVisionReviewUi.kt'
      - 'android/app/src/main/java/com/buysloans/hub/MorleyAssessmentBridge.kt'
      - 'tests/morley-ai-assessment-core.test.mjs'
      - 'tests/morley-ai-device-lens-integration.test.mjs'
      - 'tests/morley-ai-damage-review-contract.test.mjs'
      - 'tests/morley-ai-diagnostics-condition.test.mjs'
      - '.github/workflows/morley-ai-assessment-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run assessment core contract
        run: node --test tests/morley-ai-assessment-core.test.mjs
      - name: Run Device Lens assessment integration contract
        run: node --test tests/morley-ai-device-lens-integration.test.mjs
      - name: Run AI damage review contract
        run: node --test tests/morley-ai-damage-review-contract.test.mjs
      - name: Run staff diagnostics and Condition Score contract
        run: node --test tests/morley-ai-diagnostics-condition.test.mjs
