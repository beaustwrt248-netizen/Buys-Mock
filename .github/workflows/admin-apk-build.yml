name: Admin APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - '.github/workflows/admin-apk-build.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - '.github/workflows/admin-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Test and lint Admin APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:testDebugUnitTest :adminapp:lintDebug
      - name: Build PR Admin debug APK
        if: github.event_name == 'pull_request'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:assembleDebug
      - name: Prepare stable Admin signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-admin-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build stable signed Admin release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:assembleRelease
      - name: Stage Admin APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cp android/adminapp/build/outputs/apk/debug/adminapp-debug.apk dist/Morley-Admin-readonly.apk
          else
            cp android/adminapp/build/outputs/apk/release/adminapp-release.apk dist/Morley-Admin-readonly.apk
          fi
          sha256sum dist/Morley-Admin-readonly.apk > dist/Morley-Admin-readonly.apk.sha256
      - name: Verify stable Admin signer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/Morley-Admin-readonly.apk)"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Verify Admin APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/Morley-Admin-readonly.apk.sha256
      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morley-admin-readonly-apk
          path: |
            dist/Morley-Admin-readonly.apk
            dist/Morley-Admin-readonly.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish-admin-ota:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-admin-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download verified Admin APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: morley-admin-readonly-apk
          path: dist
      - name: Resolve Admin release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text=Path('android/adminapp/build.gradle').read_text(encoding='utf-8')
          code=re.search(r'\bversionCode\s+(\d+)', text)
          name=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", text)
          if not code or not name or int(code.group(1)) < 1 or not name.group(1).strip():
              raise SystemExit('Invalid Admin release identity')
          safe=re.sub(r'[^A-Za-z0-9._-]+','-',name.group(1)).strip('-')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'ADMIN_VERSION_CODE={code.group(1)}\n')
              fh.write(f'ADMIN_VERSION_NAME={name.group(1)}\n')
              fh.write(f'ADMIN_VERSION_SAFE={safe}\n')
              fh.write(f'ADMIN_RELEASE_TAG=admin-v{safe}\n')
              fh.write(f'ADMIN_RELEASE_FILE=Morley-Admin-{safe}.apk\n')
          PY
      - name: Verify release artifact and stage immutable filename
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/Morley-Admin-readonly.apk.sha256
          cp dist/Morley-Admin-readonly.apk "dist/${ADMIN_RELEASE_FILE}"
          ADMIN_SHA256="$(sha256sum "dist/${ADMIN_RELEASE_FILE}" | awk '{print $1}')"
          test "${#ADMIN_SHA256}" = 64
          echo "ADMIN_SHA256=$ADMIN_SHA256" >> "$GITHUB_ENV"
      - name: Publish or verify immutable Admin GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$ADMIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rm -rf "$RUNNER_TEMP/admin-existing-release"
            mkdir -p "$RUNNER_TEMP/admin-existing-release"
            gh release download "$ADMIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ADMIN_RELEASE_FILE" --dir "$RUNNER_TEMP/admin-existing-release"
            EXISTING_SHA="$(sha256sum "$RUNNER_TEMP/admin-existing-release/$ADMIN_RELEASE_FILE" | awk '{print $1}')"
            test "$EXISTING_SHA" = "$ADMIN_SHA256" || { echo 'Existing Admin release asset does not match this signed build.' >&2; exit 1; }
            echo "Verified existing immutable Admin release $ADMIN_RELEASE_TAG"
          else
            gh release create "$ADMIN_RELEASE_TAG" "dist/${ADMIN_RELEASE_FILE}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Morley Admin ${ADMIN_VERSION_NAME}" \
              --notes "Signed Morley Admin Control OTA release. Built from ${GITHUB_SHA}; Admin tests, lint, stable signer verification and SHA-256 integrity verification passed." \
              --latest=false
          fi
      - name: Publish Admin OTA metadata to Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          gradle=Path('android/adminapp/build.gradle').read_text(encoding='utf-8')
          code=re.search(r'\bversionCode\s+(\d+)', gradle)
          name=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", gradle)
          expected_code=int(os.environ['ADMIN_VERSION_CODE'])
          expected_name=os.environ['ADMIN_VERSION_NAME']
          if not code or not name or int(code.group(1)) != expected_code or name.group(1) != expected_name:
              raise SystemExit('Main advanced to a different Admin version; refusing to publish stale OTA metadata.')
          release_file=os.environ['ADMIN_RELEASE_FILE']
          data={
              'versionCode': expected_code,
              'versionName': expected_name,
              'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['ADMIN_RELEASE_TAG']}/{release_file}",
              'sha256': os.environ['ADMIN_SHA256'],
              'required': False,
              'sourceSha': os.environ['GITHUB_SHA'],
          }
          Path('admin').mkdir(parents=True, exist_ok=True)
          Path('admin/admin-update.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          d=json.loads(Path('admin/admin-update.json').read_text())
          assert isinstance(d['versionCode'],int) and d['versionCode'] > 0
          assert d['versionName']
          assert d['apkUrl'].startswith('https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/admin-v')
          assert re.fullmatch(r'[0-9a-f]{64}',d['sha256'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/admin-update.json
          if git diff --cached --quiet; then
            echo 'Admin OTA metadata already current.'
          else
            git commit -m "Publish Morley Admin ${ADMIN_VERSION_NAME} OTA metadata"
            gh auth setup-git
            git push origin HEAD:main
          fi
