name: Admin APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - '.github/workflows/admin-apk-build.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - '.github/workflows/admin-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      admin_app_changed: ${{ steps.admin-change.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect Admin app source change
        id: admin-change
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "${GITHUB_SHA}^" "$GITHUB_SHA" -- android/adminapp; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Test and lint Admin APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:testDebugUnitTest :adminapp:lintDebug
      - name: Build PR Admin debug APK
        if: github.event_name == 'pull_request'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:assembleDebug
      - name: Prepare stable Admin signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-admin-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build stable signed Admin release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:assembleRelease
      - name: Stage Admin APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cp android/adminapp/build/outputs/apk/debug/adminapp-debug.apk dist/Morley-Admin-readonly.apk
          else
            cp android/adminapp/build/outputs/apk/release/adminapp-release.apk dist/Morley-Admin-readonly.apk
          fi
          sha256sum dist/Morley-Admin-readonly.apk > dist/Morley-Admin-readonly.apk.sha256
      - name: Verify stable Admin signer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/Morley-Admin-readonly.apk)"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Verify Admin APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/Morley-Admin-readonly.apk.sha256
      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morley-admin-readonly-apk
          path: |
            dist/Morley-Admin-readonly.apk
            dist/Morley-Admin-readonly.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish-admin-ota:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-admin-apk.outputs.admin_app_changed == 'true'
    needs: build-admin-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download verified Admin APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: morley-admin-readonly-apk
          path: dist
      - name: Resolve and validate next Admin release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          text=Path('android/adminapp/build.gradle').read_text(encoding='utf-8')
          code=re.search(r'\bversionCode\s+(\d+)', text)
          name=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", text)
          if not code or not name or int(code.group(1)) < 1 or not name.group(1).strip():
              raise SystemExit('Invalid Admin release identity')
          current_code=int(code.group(1)); current_name=name.group(1).strip()
          metadata=Path('admin/admin-update.json')
          if metadata.exists():
              published=json.loads(metadata.read_text(encoding='utf-8'))
              published_code=int(published.get('versionCode',0))
              if current_code != published_code + 1:
                  raise SystemExit(f'Admin app source changed: versionCode {current_code} must be exactly one above published Admin OTA {published_code}.')
          safe=re.sub(r'[^A-Za-z0-9._-]+','-',current_name).strip('-')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'ADMIN_VERSION_CODE={current_code}\n')
              fh.write(f'ADMIN_VERSION_NAME={current_name}\n')
              fh.write(f'ADMIN_VERSION_SAFE={safe}\n')
              fh.write(f'ADMIN_RELEASE_TAG=admin-v{safe}\n')
              fh.write(f'ADMIN_RELEASE_FILE=Morley-Admin-{safe}.apk\n')
          PY
      - name: Verify release artifact and stage immutable filename
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/Morley-Admin-readonly.apk.sha256
          cp dist/Morley-Admin-readonly.apk "dist/${ADMIN_RELEASE_FILE}"
          ADMIN_SHA256="$(sha256sum "dist/${ADMIN_RELEASE_FILE}" | awk '{print $1}')"
          test "${#ADMIN_SHA256}" = 64
          echo "ADMIN_SHA256=$ADMIN_SHA256" >> "$GITHUB_ENV"
      - name: Publish immutable Admin GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$ADMIN_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Admin release tag $ADMIN_RELEASE_TAG already exists; refusing version identity reuse." >&2
            exit 1
          fi
          gh release create "$ADMIN_RELEASE_TAG" "dist/${ADMIN_RELEASE_FILE}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morley Admin ${ADMIN_VERSION_NAME}" \
            --notes "Signed Morley Admin Control OTA release. Built from ${GITHUB_SHA}; Admin tests, lint, stable signer verification and SHA-256 integrity verification passed." \
            --latest=false
      - name: Publish Admin OTA metadata through protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          gradle=Path('android/adminapp/build.gradle').read_text(encoding='utf-8')
          code=re.search(r'\bversionCode\s+(\d+)', gradle)
          name=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", gradle)
          expected_code=int(os.environ['ADMIN_VERSION_CODE'])
          expected_name=os.environ['ADMIN_VERSION_NAME']
          if not code or not name or int(code.group(1)) != expected_code or name.group(1) != expected_name:
              raise SystemExit('Main advanced to a different Admin version; refusing to publish stale OTA metadata.')
          release_file=os.environ['ADMIN_RELEASE_FILE']
          data={
              'versionCode': expected_code,
              'versionName': expected_name,
              'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['ADMIN_RELEASE_TAG']}/{release_file}",
              'sha256': os.environ['ADMIN_SHA256'],
              'required': False,
              'sourceSha': os.environ['GITHUB_SHA'],
          }
          Path('admin').mkdir(parents=True, exist_ok=True)
          Path('admin/admin-update.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          d=json.loads(Path('admin/admin-update.json').read_text())
          assert isinstance(d['versionCode'],int) and d['versionCode'] > 0
          assert d['versionName']
          assert d['apkUrl'].startswith('https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/admin-v')
          assert re.fullmatch(r'[0-9a-f]{64}',d['sha256'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/admin-update.json
          git diff --cached --quiet && { echo 'Expected a new Admin OTA metadata version.' >&2; exit 1; }

          BRANCH="automation/admin-ota-${ADMIN_VERSION_SAFE}-${GITHUB_RUN_ID}"
          git checkout -B "$BRANCH"
          git commit -m "Publish Morley Admin ${ADMIN_VERSION_NAME} OTA metadata"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"

          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Publish Morley Admin ${ADMIN_VERSION_NAME} OTA metadata" \
            --body "Automated Admin OTA metadata publication for the exact signed ${ADMIN_VERSION_NAME} build. Main protection remains enforced; required checks must pass before merge.")"

          gh workflow run security-audit.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run quality-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          sleep 5
          gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" --required --watch --interval 10
          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

  deploy-admin-ota-feed:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-admin-apk.result == 'success' && (needs.publish-admin-ota.result == 'success' || needs.publish-admin-ota.result == 'skipped')
    needs: [build-admin-apk, publish-admin-ota]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main including Admin OTA metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate published Admin OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          d=json.loads(Path('admin/admin-update.json').read_text(encoding='utf-8'))
          assert isinstance(d.get('versionCode'),int) and d['versionCode'] > 0
          assert str(d.get('versionName','')).strip()
          assert str(d.get('apkUrl','')).startswith('https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/admin-v')
          assert re.fullmatch(r'[0-9a-f]{64}',str(d.get('sha256','')))
          assert isinstance(d.get('required'),bool)
          assert re.fullmatch(r'[0-9a-f]{40}',str(d.get('sourceSha','')))
          PY
      - name: Build static web bundle with Admin OTA feed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_audit.py
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -v ./*.css site/
          cp -v ./*.js site/
          cp -R admin site/admin
          if [ -d web-assets ]; then cp -R web-assets site/web-assets; fi
          touch site/.nojekyll
          test -s site/index.html
          test -s site/admin/index.html
          test -s site/admin/admin-update.json
          test -s site/web-assets/morley_buys_login_bg_app.mp4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload web site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live Admin OTA feed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/live-admin-update.json" "$BASE/admin/admin-update.json"; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('admin/admin-update.json').read_text(encoding='utf-8'))
          live=json.loads(Path(__import__('os').environ['RUNNER_TEMP'],'live-admin-update.json').read_text(encoding='utf-8'))
          if live != expected:
              raise SystemExit(1)
          PY
              then
                echo 'Live Admin OTA metadata matches main.'
                exit 0
              fi
            fi
            echo "Waiting for Admin OTA feed propagation ($attempt/6)"
            sleep 10
          done
          echo 'Live Admin OTA feed did not match the published metadata.' >&2
          exit 1
