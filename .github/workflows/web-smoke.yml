name: Web Release Smoke Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - '.github/workflows/web-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - '.github/workflows/web-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web asset graph
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('.')
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:href|src)=\\?"([^"?]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')): continue
              path = root / ref.lstrip('./')
              if not path.exists(): missing.append(ref)
          if missing: raise SystemExit('Missing local assets referenced by index.html: ' + ', '.join(missing))
          required = ['secure-pricing.js','web-auth.js','signed-in-user.js','desktop-parity.js','reference-theme.css','no-gold.css','premium-motion.css','admin/index.html','admin/app.js','admin/styles.css','admin/invites.js','admin/targeted-notifications.js','admin/turnstile.html']
          absent = [p for p in required if not Path(p).is_file()]
          if absent: raise SystemExit('Required production web assets missing: ' + ', '.join(absent))
          if 'no-gold.css' not in html: raise SystemExit('Final no-gold safeguard is not loaded by index.html')
          if html.rfind('no-gold.css') < html.rfind('reference-theme.css'): raise SystemExit('no-gold.css must load after the other theme layers')
          if 'secure-pricing.js' not in html: raise SystemExit('Production shell does not load authenticated pricing transport')
          print('Web asset graph OK')
          PY

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in secure-pricing.js app.js web-auth.js signed-in-user.js desktop-parity.js desktop-oem.js workflow.js admin/app.js admin/invites.js admin/targeted-notifications.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Reject legacy gold in active web UI layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          active = ['mobile-more.css','cyber-ui.css','cyber-spectrum.css','premium-motion.css','reference-theme.css','no-gold.css','web-auth.js','desktop-parity.js','admin/styles.css','admin/index.html','admin/app.js']
          forbidden = ['#ffd400','#ffe65b','#ffd000','#ffc800','#ffe95a','#c99a27','#ddb347','#cda51d','#e0bb39','#caa21c','#e1bd3d','rgba(255,212,0','rgb(255,212,0']
          failures=[]
          for file in active:
              text=Path(file).read_text(encoding='utf-8').lower(); found=[t for t in forbidden if t in text]
              if found: failures.append(f'{file}: {", ".join(found)}')
          if failures: raise SystemExit('Legacy gold detected in active UI layers:\n'+'\n'.join(failures))
          print('No legacy gold found in active web/admin UI layers')
          PY

      - name: Validate auth navigation pricing and admin hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'web-auth.js':['morley-web-signout','clearSession()','verifyAuthorised'],
            'signed-in-user.js':['display_name','morley-web-user'],
            'desktop-parity.js':['morleyDesktopGo','morley-section-back'],
            'secure-pricing.js':["localStorage.getItem(STORE)","'Authorization':'Bearer '+token",'window.market=secureMarket'],
            'desktop-oem.js':["localStorage.getItem('morley_web_auth')","'Authorization':'Bearer '+token"],
            'admin/app.js':['admin-user-control',"secureUserAction('set_role'",'secureUserAction'],
            'admin/invites.js':['crypto.getRandomValues','sha256Hex'],
            'admin/turnstile.html':['postMessage(payload,parentOrigin)'],
          }
          for file,needles in checks.items():
              text=Path(file).read_text(encoding='utf-8'); missing=[n for n in needles if n not in text]
              if missing: raise SystemExit(f'{file} missing expected production hooks: {missing}')
          if "sb.rpc('admin_set_user_role'" in Path('admin/app.js').read_text(encoding='utf-8'):
              raise SystemExit('Admin role changes must use the hardened admin-user-control Edge Function')
          print('Auth/navigation/pricing/admin hooks OK')
          PY
