name: Web Release Smoke Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - '.github/workflows/web-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - '.github/workflows/web-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web asset graph
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('.')
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:href|src)=\\?"([^"?]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')): continue
              path = root / ref.lstrip('./')
              if not path.exists(): missing.append(ref)
          if missing: raise SystemExit('Missing local assets referenced by index.html: ' + ', '.join(missing))
          required = [
              'secure-pricing.js','web-auth.js','signed-in-user.js','desktop-parity.js',
              'smart-workspace.js','smart-workspace-plus.js','smart-insights.js','smart-input-polish.js',
              'connection-status.js','web-diagnostics.js','menu-parity-polish.js','menu-dialog-a11y.js',
              'web-notification-centre.js','web-display-parity.js','web-issue-report.js','reference-theme.css','no-gold.css','premium-motion.css','morley-light-web.css',
              'admin/index.html','admin/app.js','admin/styles.css','admin/invites.js','admin/targeted-notifications.js','admin/turnstile.html','admin/login-security.js'
          ]
          absent = [p for p in required if not Path(p).is_file()]
          if absent: raise SystemExit('Required production web assets missing: ' + ', '.join(absent))
          if 'no-gold.css' not in html: raise SystemExit('Final no-gold safeguard is not loaded by index.html')
          if html.rfind('no-gold.css') < html.rfind('reference-theme.css'): raise SystemExit('no-gold.css must load after the other theme layers')
          if html.rfind('morley-light-web.css') < html.rfind('mobile-parity-v3.css'): raise SystemExit('morley-light-web.css must be the final visual theme layer')
          if 'secure-pricing.js' not in html: raise SystemExit('Production shell does not load authenticated pricing transport')
          for asset in ['smart-workspace.js','smart-workspace-plus.js','smart-insights.js','smart-input-polish.js','connection-status.js','web-diagnostics.js','web-notification-centre.js','web-display-parity.js','web-issue-report.js']:
              if asset not in html: raise SystemExit(f'Production shell does not load required smart workspace asset: {asset}')
          if html.find('smart-workspace.js') > html.find('smart-workspace-plus.js'):
              raise SystemExit('smart-workspace.js must load before smart-workspace-plus.js')
          print('Web asset graph OK')
          PY

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in secure-pricing.js app.js web-auth.js signed-in-user.js desktop-parity.js desktop-oem.js workflow.js smart-workspace.js smart-workspace-plus.js smart-insights.js smart-input-polish.js connection-status.js web-diagnostics.js menu-parity-polish.js menu-dialog-a11y.js account-refresh-parity.js web-notification-centre.js web-display-parity.js web-issue-report.js admin/app.js admin/invites.js admin/targeted-notifications.js admin/login-security.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Validate web asset cache versions
        run: python3 scripts/web_asset_cache_audit.py

      - name: Reject legacy gold in active web UI layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          active = ['mobile-more.css','cyber-ui.css','cyber-spectrum.css','premium-motion.css','reference-theme.css','no-gold.css','morley-light-web.css','web-auth.js','desktop-parity.js','smart-workspace.js','smart-workspace-plus.js','smart-insights.js','web-issue-report.js','admin/styles.css','admin/index.html','admin/app.js']
          forbidden = ['#ffd400','#ffe65b','#ffd000','#ffc800','#ffe95a','#c99a27','#ddb347','#cda51d','#e0bb39','#caa21c','#e1bd3d','rgba(255,212,0','rgb(255,212,0']
          failures=[]
          for file in active:
              text=Path(file).read_text(encoding='utf-8').lower(); found=[t for t in forbidden if t in text]
              if found: failures.append(f'{file}: {", ".join(found)}')
          if failures: raise SystemExit('Legacy gold detected in active UI layers:\n'+'\n'.join(failures))
          print('No legacy gold found in active web/admin UI layers')
          PY

      - name: Validate auth navigation pricing smart workspace and admin hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'web-auth.js':['morley-web-signout','clearSession()','verifyAuthorised','redeem-app-invite'],
            'signed-in-user.js':['display_name','morley-web-user'],
            'desktop-parity.js':['morleyDesktopGo','morley-section-back'],
            'secure-pricing.js':["localStorage.getItem(STORE)","'Authorization':'Bearer '+s.access_token",'window.market=secureMarket','refreshSession'],
            'smart-workspace.js':['morleySmartWorkspace','Quick Deal Mode','morley-watchlist-updated','morley-valuation-history-updated','GREAT BUY','GOOD BUY'],
            'smart-workspace-plus.js':['morleySmartWorkspacePlus','OFFLINE · CACHED','Potential margin','data-remove'],
            'smart-insights.js':['morleySmartInsights'],
            'connection-status.js':['navigator.onLine'],
            'web-diagnostics.js':['Diagnostics',"includes('Report an Issue')",'insertBefore(row,report)'],
            'web-notification-centre.js':['Notification Centre','clearRead','morleyClearRead','MorleyNotifications',"insertAdjacentElement('beforebegin',row)"],
            'web-display-parity.js':['mmKeepAwake','mmReducedMotion','mmCompactInterface','morley-reduced-motion','morley-compact-interface','syncWakeLock'],
            'web-issue-report.js':['support_tickets','support_ticket_attachments','support-ticket-attachments','diagnostics_opt_in','Submit Support Ticket','morley_web_auth','MAX_ATTACHMENT_BYTES'],
            'desktop-oem.js':["localStorage.getItem('morley_web_auth')","'Authorization':'Bearer '+token"],
            'admin/index.html':['id="inviteName"','First and last name','styles.css?v=3','app.js?v=4','invites.js?v=3'],
            'admin/app.js':['admin-user-control',"secureUserAction('set_role'","secureUserAction('set_display_name'",'data-name-save','secureUserAction'],
            'admin/invites.js':['send-morley-email',"action:'create_invite'",'display_name:name','inviteName'],
            'admin/turnstile.html':["const postMessageOrigin=parentOrigin&&parentOrigin!=='null'?parentOrigin:'*'",'postMessage(payload,postMessageOrigin)'],
            'admin/login-security.js':['event.source===frame.contentWindow','event.origin===window.location.origin',"window.location.origin==='null'&&event.origin==='null'"],
          }
          for file,needles in checks.items():
              text=Path(file).read_text(encoding='utf-8'); missing=[n for n in needles if n not in text]
              if missing: raise SystemExit(f'{file} missing expected production hooks: {missing}')
          invites=Path('admin/invites.js').read_text(encoding='utf-8')
          for forbidden in ('crypto.getRandomValues','sha256Hex','admin_create_team_invite'):
              if forbidden in invites: raise SystemExit(f'Admin invite UI still creates/hashes invite secrets client-side: {forbidden}')
          if "postMessage(payload,'*')" in Path('admin/turnstile.html').read_text(encoding='utf-8') or 'postMessage(payload,"*")' in Path('admin/turnstile.html').read_text(encoding='utf-8'):
              raise SystemExit('Turnstile bridge must not unconditionally broadcast CAPTCHA tokens')
          if "sb.rpc('admin_set_user_role'" in Path('admin/app.js').read_text(encoding='utf-8'):
              raise SystemExit('Admin role changes must use the hardened admin-user-control Edge Function')
          print('Auth/navigation/pricing/smart-workspace/admin/full-name/support-ticket hooks OK')
          PY
