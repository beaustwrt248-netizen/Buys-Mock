name: Repository Security Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run credential and workflow audit
        run: python3 scripts/security_audit.py
      - name: Run privacy regression audit
        run: python3 scripts/privacy_audit.py
