name: Admin Android Least-Privilege Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - 'admin/index.html'
      - 'admin/user-management-policy.js'
      - 'admin/login-security.js'
      - 'tests/admin-webview-input-focus.test.mjs'
      - 'tests/admin-auth-recovery-contract.test.mjs'
      - 'supabase/migrations/**safe_remote_feature_flags.sql'
      - '.github/workflows/admin-android-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - 'admin/index.html'
      - 'admin/user-management-policy.js'
      - 'admin/login-security.js'
      - 'tests/admin-webview-input-focus.test.mjs'
      - 'tests/admin-auth-recovery-contract.test.mjs'
      - 'supabase/migrations/**safe_remote_feature_flags.sql'
      - '.github/workflows/admin-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.3.1'
      - name: Verify Admin app stays isolated and least-privilege
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=android/adminapp/src/main/java/com/buysloans/admin
          ACTIVITY="$ROOT/AdminActivity.kt"
          LOGIN="$ROOT/AdminLoginActivity.kt"
          CAPTCHA="$ROOT/CaptchaChallenge.kt"
          DASHBOARD="$ROOT/AdminNativeDashboard.kt"
          STORE="$ROOT/AdminSessionStore.kt"

          grep -q "applicationId 'com.buysloans.admin'" android/adminapp/build.gradle
          grep -Eq "versionName '[^']+'" android/adminapp/build.gradle

          # Authenticated workspace is native Compose. It must never regain a browser runtime,
          # JavaScript session handoff or web logout fallback.
          grep -q 'AdminSessionStore.current()' "$ACTIVITY"
          grep -q 'AdminSessionStore.hasAuthorizedSession()' "$ACTIVITY"
          grep -q 'AdminNativeDashboard' "$ACTIVITY"
          ! grep -Eq 'android\.webkit|WebView|CookieManager|evaluateJavascript|loadUrl\(|AdminWebParityPolicy|installNativeAdminSession|native-logout|EXTRA_ACCESS_TOKEN|EXTRA_REFRESH_TOKEN|addJavascriptInterface' "$ACTIVITY"
          ! grep -Eq 'android\.webkit|WebView|evaluateJavascript|installNativeAdminSession|addJavascriptInterface' "$DASHBOARD"
          grep -q 'NATIVE CONTROL MODE' "$DASHBOARD"
          grep -q 'SupportOperationsPanel' "$DASHBOARD"
          grep -q 'GuardianPanel' "$DASHBOARD"
          grep -q 'ManualNotificationPanel' "$DASHBOARD"
          grep -q 'UserManagementPanel' "$DASHBOARD"
          grep -q 'AuditTimelinePanel' "$DASHBOARD"
          grep -q 'AdminAppAccessPolicy.canReadFullSnapshot(session)' "$DASHBOARD"

          # Native login owns the authorized process session before navigation and does not put
          # access/refresh tokens into Intents.
          grep -q 'AdminSessionStore.set(session)' "$LOGIN"
          grep -q 'Intent(this, AdminActivity::class.java)' "$LOGIN"
          ! grep -Eq 'EXTRA_ACCESS_TOKEN|EXTRA_REFRESH_TOKEN|putExtra\(AdminActivity' "$LOGIN"
          grep -q 'private var active: AdminSession?' "$STORE"
          grep -q 'fun clear()' "$STORE"
          grep -q 'active?.accessToken = ""' "$STORE"
          grep -q 'active?.refreshToken = ""' "$STORE"

          # Exactly one Android JavaScript bridge is allowed in the whole Admin app, and it is
          # the tightly-scoped Turnstile challenge only.
          test "$(grep -Rho 'addJavascriptInterface(' "$ROOT" | wc -l)" = "1"
          grep -q 'addJavascriptInterface(' "$CAPTCHA"
          grep -q '"AndroidBridge"' "$CAPTCHA"
          grep -q 'domStorageEnabled = false' "$CAPTCHA"
          grep -q 'allowFileAccess = false' "$CAPTCHA"
          grep -q 'allowContentAccess = false' "$CAPTCHA"
          grep -q 'databaseEnabled = false' "$CAPTCHA"
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' "$CAPTCHA"

          # Existing backend-first least-privilege API boundaries remain intact.
          grep -q '/rest/v1/rpc/admin_set_config' "$ROOT/AdminApi.kt"
          test "$(grep -Rho '/rest/v1/rpc/admin_set_config' "$ROOT" | wc -l)" = "1"
          grep -q '/rest/v1/support_tickets?id=eq.' "$ROOT/AdminApi.kt"
          grep -q 'authorizedRequest(session, path, "PATCH", payload, preferMinimal = true)' "$ROOT/AdminApi.kt"
          grep -q 'grant_type=refresh_token' "$ROOT/AdminApi.kt"
          test "$(grep -Rho 'PATCH' "$ROOT" | wc -l)" = "1"
          test "$(grep -Rlo '/functions/v1/admin-user-control' "$ROOT" | wc -l)" = "2"
          grep -q '/functions/v1/admin-user-control' "$ROOT/UserControlApi.kt"
          grep -q '/functions/v1/admin-user-control' "$ROOT/TeamInviteApi.kt"
          ! grep -REq 'force_signout|queueNotif|/rest/v1/app_config.*(PATCH|PUT|DELETE)|request\([^,]+, "(PUT|DELETE)"' "$ROOT"
          ! grep -REqi 'service[_-]?role|SUPABASE_SECRET_KEY' android/adminapp
          grep -q "only maintenanceMode and maintenanceMessage may be changed remotely" supabase/migrations/*safe_remote_feature_flags.sql
          grep -q "config_key='feature_flags'" supabase/migrations/*safe_remote_feature_flags.sql
          grep -q "admin_audit_log" supabase/migrations/*safe_remote_feature_flags.sql
      - name: Verify native Admin login and session contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/admin-webview-input-focus.test.mjs tests/admin-auth-recovery-contract.test.mjs
      - name: Compile, test and lint Admin module only
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:testDebugUnitTest :adminapp:lintDebug :adminapp:assembleDebug
