name: Admin Android Read-Only Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - '.github/workflows/admin-android-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - '.github/workflows/admin-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Verify Admin app stays isolated and read-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.buysloans.admin'" android/adminapp/build.gradle
          grep -q "versionName '0.1.0-readonly'" android/adminapp/build.gradle
          grep -q 'READ-ONLY MODE' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
          ! grep -REq 'force_signout|admin-user-control|admin_set_config|queueNotif|DELETE|PATCH|PUT' android/adminapp/src/main/java
          ! grep -REqi 'service[_-]?role|SUPABASE_SECRET_KEY' android/adminapp
      - name: Compile, test and lint Admin module only
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:testDebugUnitTest :adminapp:lintDebug :adminapp:assembleDebug
