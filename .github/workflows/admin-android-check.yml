name: Admin Android Least-Privilege Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - 'supabase/migrations/**safe_remote_feature_flags.sql'
      - '.github/workflows/admin-android-check.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/adminapp/**'
      - 'android/settings.gradle'
      - 'supabase/migrations/**safe_remote_feature_flags.sql'
      - '.github/workflows/admin-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Verify Admin app stays isolated and least-privilege
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.buysloans.admin'" android/adminapp/build.gradle
          grep -Eq "versionName '[^']+'" android/adminapp/build.gradle

          # The Admin app may use the legacy native surface or the canonical
          # web Admin surface. When web parity is active, fail closed unless the
          # privileged WebView is pinned to HTTPS buyshub.me/admin and disables
          # mixed, file and content access.
          if grep -q 'AdminWebParityPolicy.HOME_URL' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt; then
            grep -q 'const val HOME_URL = "https://buyshub.me/admin/"' android/adminapp/src/main/java/com/buysloans/admin/AdminWebParityPolicy.kt
            grep -q 'private const val ADMIN_HOST = "buyshub.me"' android/adminapp/src/main/java/com/buysloans/admin/AdminWebParityPolicy.kt
            grep -q 'uri.scheme.equals("https"' android/adminapp/src/main/java/com/buysloans/admin/AdminWebParityPolicy.kt
            grep -q 'path == "/admin" || path.startsWith("/admin/")' android/adminapp/src/main/java/com/buysloans/admin/AdminWebParityPolicy.kt
            grep -q 'AdminWebParityPolicy.isTrustedAdminUrl' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
            grep -q 'mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
            grep -q 'allowFileAccess = false' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
            grep -q 'allowContentAccess = false' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
            grep -q 'javaScriptCanOpenWindowsAutomatically = false' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
            ! grep -REq 'addJavascriptInterface|setAllowUniversalAccessFromFileURLs\(true\)|setAllowFileAccessFromFileURLs\(true\)' android/adminapp/src/main/java
          else
            grep -q 'CONTROLLED ADMIN MODE' android/adminapp/src/main/java/com/buysloans/admin/AdminActivity.kt
          fi

          grep -q '/rest/v1/rpc/admin_set_config' android/adminapp/src/main/java/com/buysloans/admin/AdminApi.kt
          test "$(grep -Rho '/rest/v1/rpc/admin_set_config' android/adminapp/src/main/java | wc -l)" = "1"
          grep -q '/rest/v1/support_tickets?id=eq.' android/adminapp/src/main/java/com/buysloans/admin/AdminApi.kt
          grep -q 'authorizedRequest(session, path, "PATCH", payload, preferMinimal = true)' android/adminapp/src/main/java/com/buysloans/admin/AdminApi.kt
          grep -q 'grant_type=refresh_token' android/adminapp/src/main/java/com/buysloans/admin/AdminApi.kt
          test "$(grep -Rho 'PATCH' android/adminapp/src/main/java | wc -l)" = "1"
          test "$(grep -Rlo '/functions/v1/admin-user-control' android/adminapp/src/main/java | wc -l)" = "2"
          grep -q '/functions/v1/admin-user-control' android/adminapp/src/main/java/com/buysloans/admin/UserControlApi.kt
          grep -q '/functions/v1/admin-user-control' android/adminapp/src/main/java/com/buysloans/admin/TeamInviteApi.kt
          ! grep -REq 'force_signout|queueNotif|/rest/v1/app_config.*(PATCH|PUT|DELETE)|request\([^,]+, "(PUT|DELETE)"' android/adminapp/src/main/java
          ! grep -REqi 'service[_-]?role|SUPABASE_SECRET_KEY' android/adminapp
          grep -q "only maintenanceMode and maintenanceMessage may be changed remotely" supabase/migrations/*safe_remote_feature_flags.sql
          grep -q "config_key='feature_flags'" supabase/migrations/*safe_remote_feature_flags.sql
          grep -q "admin_audit_log" supabase/migrations/*safe_remote_feature_flags.sql
      - name: Compile, test and lint Admin module only
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :adminapp:testDebugUnitTest :adminapp:lintDebug :adminapp:assembleDebug
