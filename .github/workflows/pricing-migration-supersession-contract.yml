name: Pricing Migration Supersession Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-migration-supersession-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: pricing-migration-supersession
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pricing migration supersession contract
        run: node --test tests/pricing-migration-supersession-contract.test.mjs
