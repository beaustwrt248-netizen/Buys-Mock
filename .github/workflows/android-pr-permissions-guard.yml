name: Android PR Permissions Guard

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/android-pr-readonly.yml'
      - '.github/workflows/android-pr-permissions-guard.yml'
      - 'scripts/check_android_pr_permissions.py'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify PR workflow remains least privilege
        run: python3 scripts/check_android_pr_permissions.py
