name: Autopilot Risk Classifier Contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/auto-review-merge.yml'
      - '.github/workflows/autopilot-risk-classifier-contract.yml'
      - 'tests/auto-review-risk-classification.test.mjs'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/auto-review-merge.yml'
      - '.github/workflows/autopilot-risk-classifier-contract.yml'
      - 'tests/auto-review-risk-classification.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Autopilot risk classification
        run: node --test tests/auto-review-risk-classification.test.mjs
