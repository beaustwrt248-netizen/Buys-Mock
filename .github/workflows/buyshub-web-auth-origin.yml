name: Buyshub Web Auth Origin

on:
  pull_request:
    paths:
      - 'web-auth.js'
      - 'index.html'
      - 'tests/buyshub-web-auth-origin.test.js'
      - '.github/workflows/buyshub-web-auth-origin.yml'

permissions:
  contents: read

jobs:
  origin-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Verify active-origin auth assets and CAPTCHA enforcement
        run: node tests/buyshub-web-auth-origin.test.js
