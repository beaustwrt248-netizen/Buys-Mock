name: Morley Restore Point Capture

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'admin/**'
      - 'nova/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'web-base.html'
      - 'web-assets/**'
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'admin/**'
      - 'nova/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'web-base.html'
      - 'web-assets/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve known-good base_ref and changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SOURCE_SHA="$PR_BASE_SHA"
            CHANGE_REF="PR-${PR_NUMBER}"
            git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA" > changed-files.txt
          else
            SOURCE_SHA="$BEFORE_SHA"
            CHANGE_REF="push-${CURRENT_SHA}"
            if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' || printf '%s' "$SOURCE_SHA" | grep -Eq '^0+$'; then
              SOURCE_SHA="$(git rev-parse HEAD^)"
            fi
            git diff --name-only "$SOURCE_SHA" "$CURRENT_SHA" > changed-files.txt
          fi
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'change_ref=%s\n' "$CHANGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build pre-deployment restore manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-restore-manifest.mjs \
            --source-sha '${{ steps.scope.outputs.source_sha }}' \
            --change-ref '${{ steps.scope.outputs.change_ref }}' \
            --files changed-files.txt \
            --output restore-point.json
          node -e "const m=require('./restore-point.json'); if(!/^[a-f0-9]{40}$/i.test(m.sourceSha)||!Array.isArray(m.components)||!m.components.length) process.exit(1)"

      - name: Upload restore-point artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: restore-point-${{ steps.scope.outputs.source_sha }}
          path: restore-point.json
          if-no-files-found: error
          retention-days: 90
