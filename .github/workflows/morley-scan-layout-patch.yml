name: Morley Scan Layout Patch

on:
  push:
    branches:
      - feature/morley-buys-scan-layout-20260914
    paths:
      - tools/apply_morley_scan_layout.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/morley-buys-scan-layout-20260914
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify contract is red before implementation
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --tests com.buysloans.hub.DeviceLensExperienceContractTest
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected new scan-layout contract to fail before implementation."
            exit 1
          fi
          echo "RED confirmed: scan-layout contract fails before implementation."

      - name: Apply approved scan layout
        run: python3 tools/apply_morley_scan_layout.py

      - name: Verify contract is green after implementation
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests com.buysloans.hub.DeviceLensExperienceContractTest

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Morley Automation"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/com/buysloans/hub/DeviceLensActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat: refresh Morley AI scan experience"
          git push origin HEAD:feature/morley-buys-scan-layout-20260914
