name: Build B&L Morley APK

on:
  push:
    branches: [ main, native-ota-component-pricing, feature-multisource-evidence, fix-release-signing, v2.4.3-icon-notifications, v2.4.4-update-notifications-icon ]
    paths:
      - 'android/**'
      - 'ota/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ota/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON" || (echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON' && exit 1)
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json >/dev/null
      - name: Run regression tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Prepare production signing key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" || (echo 'Missing BL_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing BL_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing BL_KEY_ALIAS' && exit 1)
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          VERIFY_JAR="$RUNNER_TEMP/signing-check.jar"
          printf 'signing-check' > "$RUNNER_TEMP/signing-check.txt"
          jar cf "$VERIFY_JAR" -C "$RUNNER_TEMP" signing-check.txt
          jarsigner -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" "$VERIFY_JAR" "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/B-and-L-Morley-v2.4.4-native-ota.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-and-L-Morley-Native-v2.4.4-OTA
          path: dist/B-and-L-Morley-v2.4.4-native-ota.apk
          if-no-files-found: error
      - name: Publish v2.4.4 OTA release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.4
          name: B&L Morley v2.4.4
          body: |
            Native v2.4.4 update alerts and launcher icon release.
            - Replaces the generic launcher artwork with a branded adaptive brain/circuit icon
            - Adds automatic background update checks with Android WorkManager
            - Sends a notification when a newer B&L Morley version is available
            - Tapping an update notification opens the native download/install screen
            - Retains cache-busted OTA checks, production signing and in-place upgrades
          files: dist/B-and-L-Morley-v2.4.4-native-ota.apk
          fail_on_unmatched_files: true
          make_latest: true
