name: Build B&L Morley APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'morley_buys_login_bg_app.zip'
      - 'morley_buys_login_bg_app_hq.zip'
      - 'morley_buys_login_bg_app_hq_new.zip'
      - 'scripts/release_audit.py'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'morley_buys_login_bg_app.zip'
      - 'morley_buys_login_bg_app_hq.zip'
      - 'morley_buys_login_bg_app_hq_new.zip'
      - 'scripts/release_audit.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the verified APK as an official GitHub release and update OTA metadata'
        required: true
        type: boolean
        default: false
      release_notes:
        description: 'Release notes for GitHub Release and OTA metadata (optional; defaults to the current commit subject)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.3.1'

      - name: Release readiness audit
        run: python3 scripts/release_audit.py

      - name: Resolve Android release version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          code = re.search(r'\bversionCode\s+(\d+)', gradle)
          name = re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", gradle)
          if not code or not name:
              raise SystemExit('Could not resolve versionCode/versionName from android/app/build.gradle')
          version_code = code.group(1)
          version_name = name.group(1)
          safe_name = re.sub(r'[^A-Za-z0-9._-]+', '-', version_name).strip('-')
          with open(Path(__import__('os').environ['GITHUB_ENV']), 'a', encoding='utf-8') as fh:
              fh.write(f'APP_VERSION_CODE={version_code}\n')
              fh.write(f'APP_VERSION_NAME={version_name}\n')
              fh.write(f'APP_VERSION_SAFE={safe_name}\n')
              fh.write(f'APP_RELEASE_TAG=v{safe_name}\n')
          print(f'Resolved Android release: {version_name} ({version_code})')
          PY

      - name: Bundle and verify Morley login background video
        shell: bash
        run: |
          set -euo pipefail
          ZIP=morley_buys_login_bg_app_hq_new.zip
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app_hq.zip; fi
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app.zip; fi
          test -f "$ZIP" || { echo 'Missing Morley login video ZIP'; exit 1; }
          rm -rf "$RUNNER_TEMP/morley-login-video"
          mkdir -p "$RUNNER_TEMP/morley-login-video" android/app/src/main/res/raw web-assets
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/morley-login-video"
          VIDEO_PATH="$(find "$RUNNER_TEMP/morley-login-video" -type f -iname '*.mp4' | head -n 1)"
          test -n "$VIDEO_PATH" && test -s "$VIDEO_PATH" || { echo 'No MP4 found inside Morley login video ZIP'; exit 1; }
          EXPECTED_BYTES=22004826
          EXPECTED_SHA256=2bdeb6b7add8fda997144483534d3e8b3257079c2d3932ee5c8ff5d70720b897
          ACTUAL_BYTES="$(stat -c%s "$VIDEO_PATH")"
          ACTUAL_SHA256="$(sha256sum "$VIDEO_PATH" | awk '{print $1}')"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "Verified NEW login video: $ACTUAL_BYTES bytes, SHA-256 $ACTUAL_SHA256"
          cp "$VIDEO_PATH" android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
          cp "$VIDEO_PATH" web-assets/morley_buys_login_bg_app.mp4

      - name: Prepare Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "morley-ci-placeholder",
              "storage_bucket": "morley-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.buysloans.hub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyMorleyCiPlaceholderKey000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo 'Using non-production Firebase placeholder for pull-request validation.'
          else
            echo 'FIREBASE_GOOGLE_SERVICES_JSON is required for main/release builds.' >&2
            exit 1
          fi
          python3 -m json.tool android/app/google-services.json >/dev/null

      - name: Run regression tests
        run: gradle -p android testDebugUnitTest --stacktrace --console=plain
      - name: Run Android lint
        run: gradle -p android lintDebug --stacktrace --console=plain

      - name: Build PR APK
        if: github.event_name == 'pull_request'
        run: gradle -p android assembleDebug --stacktrace --console=plain

      - name: Prepare production signing key
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: gradle -p android assembleRelease --stacktrace --console=plain

      - name: Verify release APK signature and signer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Verify exact new login video packaged in APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_BYTES=22004826
          EXPECTED_SHA256=2bdeb6b7add8fda997144483534d3e8b3257079c2d3932ee5c8ff5d70720b897
          unzip -l "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          PACKAGED_PATH="$(awk -v size="$EXPECTED_BYTES" '$1 == size && $4 ~ /^res\/.*\.mp4$/ {print $4; exit}' "$RUNNER_TEMP/apk-contents.txt")"
          test -n "$PACKAGED_PATH"
          unzip -p "$APK" "$PACKAGED_PATH" > "$RUNNER_TEMP/packaged-login.mp4"
          test "$(sha256sum "$RUNNER_TEMP/packaged-login.mp4" | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Rename APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk"
          sha256sum "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk" | tee "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk.sha256"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: B-and-L-Morley-${{ env.APP_VERSION_SAFE }}
          path: |
            dist/B-and-L-Morley-${{ env.APP_VERSION_SAFE }}.apk
            dist/B-and-L-Morley-${{ env.APP_VERSION_SAFE }}.apk.sha256
          if-no-files-found: error

  promote-login-video:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and promote canonical login video
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP=morley_buys_login_bg_app_hq_new.zip
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app_hq.zip; fi
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app.zip; fi
          test -f "$ZIP" || { echo 'Missing Morley login video ZIP'; exit 1; }
          rm -rf "$RUNNER_TEMP/morley-login-video"
          mkdir -p "$RUNNER_TEMP/morley-login-video" web-assets
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/morley-login-video"
          VIDEO_PATH="$(find "$RUNNER_TEMP/morley-login-video" -type f -iname '*.mp4' | head -n 1)"
          test -n "$VIDEO_PATH" && test -s "$VIDEO_PATH"
          EXPECTED_BYTES=22004826
          EXPECTED_SHA256=2bdeb6b7add8fda997144483534d3e8b3257079c2d3932ee5c8ff5d70720b897
          test "$(stat -c%s "$VIDEO_PATH")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$VIDEO_PATH" | awk '{print $1}')" = "$EXPECTED_SHA256"
          cp "$VIDEO_PATH" web-assets/morley_buys_login_bg_app.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f morley_buys_login_bg_app_hq_new.zip ]; then
            rm -f morley_buys_login_bg_app_hq.zip
            git mv morley_buys_login_bg_app_hq_new.zip morley_buys_login_bg_app_hq.zip
          fi
          git add -A web-assets
          if ! git diff --cached --quiet; then
            git commit -m "Promote verified new login video [skip ci]"
            gh auth setup-git
            git push origin HEAD:main
          fi

  publish-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [build, promote-login-video]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve Android release version and notes
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          code = re.search(r'\bversionCode\s+(\d+)', gradle)
          name = re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", gradle)
          if not code or not name:
              raise SystemExit('Could not resolve versionCode/versionName from android/app/build.gradle')
          safe_name = re.sub(r'[^A-Za-z0-9._-]+', '-', name.group(1)).strip('-')
          with open(Path(__import__('os').environ['GITHUB_ENV']), 'a', encoding='utf-8') as fh:
              fh.write(f'APP_VERSION_CODE={code.group(1)}\n')
              fh.write(f'APP_VERSION_NAME={name.group(1)}\n')
              fh.write(f'APP_VERSION_SAFE={safe_name}\n')
              fh.write(f'APP_RELEASE_TAG=v{safe_name}\n')
          PY
          NOTES="$(printf '%s' "$INPUT_RELEASE_NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          fi
          test -n "$NOTES"
          {
            echo 'RELEASE_NOTES<<__BL_RELEASE_NOTES__'
            printf '%s\n' "$NOTES"
            echo '__BL_RELEASE_NOTES__'
          } >> "$GITHUB_ENV"
      - name: Production release preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('ota/latest.json')
          if not path.is_file():
              raise SystemExit('Cannot publish: ota/latest.json is missing.')
          current = json.loads(path.read_text(encoding='utf-8'))
          old_code = current.get('versionCode')
          old_name = str(current.get('versionName') or '').strip()
          old_url = str(current.get('apkUrl') or '').strip()
          old_sha = str(current.get('sha256') or '').strip()
          new_code = int(os.environ['APP_VERSION_CODE'])
          if not isinstance(old_code, int) or old_code <= 0 or not old_name:
              raise SystemExit('Cannot publish: existing OTA manifest has invalid version identity.')
          if not old_url.startswith('https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/'):
              raise SystemExit('Cannot publish: existing OTA manifest has an untrusted APK URL.')
          if not re.fullmatch(r'[0-9a-fA-F]{64}', old_sha):
              raise SystemExit('Cannot publish: existing OTA manifest has an invalid SHA-256 checksum.')
          if new_code <= old_code:
              raise SystemExit(f'Cannot publish versionCode {new_code}: OTA already advertises versionCode {old_code}. Bump Android versionCode first.')
          print(f'OTA monotonicity verified: {old_name} ({old_code}) -> {os.environ["APP_VERSION_NAME"]} ({new_code})')
          PY
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${APP_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Cannot publish: Git tag ${APP_RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${APP_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Cannot publish: GitHub Release ${APP_RELEASE_TAG} already exists." >&2
            exit 1
          fi
      - name: Download verified APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: B-and-L-Morley-${{ env.APP_VERSION_SAFE }}
          path: dist
      - name: Verify downloaded checksum
        shell: bash
        run: sha256sum -c "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' 'B&L Morley production Android release.'
            printf '%s\n\n' "$RELEASE_NOTES"
            printf '%s\n' 'Verification: regression tests, Android lint, production signing and SHA-256 OTA integrity checks passed.'
          } > "$NOTES_FILE"
          gh release create "$APP_RELEASE_TAG" \
            "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk" \
            "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "B&L Morley $APP_VERSION_NAME" \
            --notes-file "$NOTES_FILE" \
            --latest
      - name: Publish OTA metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          name = os.environ['APP_VERSION_NAME']; safe = os.environ['APP_VERSION_SAFE']; code = int(os.environ['APP_VERSION_CODE']); tag = os.environ['APP_RELEASE_TAG']
          notes = os.environ['RELEASE_NOTES'].strip()
          apk_path = Path(f'dist/B-and-L-Morley-{safe}.apk')
          data = {
              'versionCode': code,
              'versionName': name,
              'apkUrl': f'https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/{tag}/B-and-L-Morley-{safe}.apk',
              'sha256': hashlib.sha256(apk_path.read_bytes()).hexdigest(),
              'notes': notes,
          }
          Path('ota').mkdir(parents=True, exist_ok=True)
          Path('ota/latest.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${APP_VERSION_NAME} OTA metadata [skip ci]"
            gh auth setup-git
            git push origin HEAD:main
          fi
