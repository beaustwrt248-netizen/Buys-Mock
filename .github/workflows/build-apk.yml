name: Build B&L Morley APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ota/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ota/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON'; exit 1; }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json >/dev/null

      - name: Run regression tests
        run: gradle -p android testDebugUnitTest --stacktrace --console=plain

      - name: Prepare production signing key
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/B-and-L-Morley-v2.5.9-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: B-and-L-Morley-Native-v2.5.9
          path: dist/B-and-L-Morley-v2.5.9-native.apk
          if-no-files-found: error

      - name: Publish v2.5.9 release
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.9
          name: B&L Morley v2.5.9
          body: |
            Heads-up notification fix.
            - Moves Admin Control messages to a fresh high-importance Android notification channel
            - Enables sound, vibration, lights and public lock-screen visibility for important alerts
            - Uses high-priority message notifications so supported Android devices can show heads-up pop-ups
            - Removes the legacy admin notification channel to avoid stale low-importance settings
            - Keeps Turnstile protection, invite-only access, OTA updates and backend security controls
          files: dist/B-and-L-Morley-v2.5.9-native.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish v2.5.9 OTA metadata
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          cat > ota/latest.json <<'EOF'
          {
            "versionCode": 19,
            "versionName": "2.5.9-native",
            "apkUrl": "https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/v2.5.9/B-and-L-Morley-v2.5.9-native.apk",
            "notes": "B&L Morley v2.5.9 upgrades Admin Control notifications to a fresh high-importance channel for Android heads-up pop-up alerts, with sound and vibration enabled."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish v2.5.9 OTA metadata [skip ci]"
            git push
          fi
