name: Build B&L Morley APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'morley_buys_login_bg_app.zip'
      - 'morley_buys_login_bg_app_hq.zip'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'morley_buys_login_bg_app.zip'
      - 'morley_buys_login_bg_app_hq.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve Android release version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          code = re.search(r'\bversionCode\s+(\d+)', gradle)
          name = re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", gradle)
          if not code or not name:
              raise SystemExit('Could not resolve versionCode/versionName from android/app/build.gradle')
          version_code = code.group(1)
          version_name = name.group(1)
          safe_name = re.sub(r'[^A-Za-z0-9._-]+', '-', version_name).strip('-')
          with open(Path(__import__('os').environ['GITHUB_ENV']), 'a', encoding='utf-8') as fh:
              fh.write(f'APP_VERSION_CODE={version_code}\n')
              fh.write(f'APP_VERSION_NAME={version_name}\n')
              fh.write(f'APP_VERSION_SAFE={safe_name}\n')
              fh.write(f'APP_RELEASE_TAG=v{safe_name}\n')
          print(f'Resolved Android release: {version_name} ({version_code})')
          PY

      - name: Bundle Morley login background video
        shell: bash
        run: |
          ZIP=morley_buys_login_bg_app_hq.zip
          if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app.zip; fi
          test -f "$ZIP" || { echo 'Missing Morley login video ZIP'; exit 1; }
          rm -rf "$RUNNER_TEMP/morley-login-video"
          mkdir -p "$RUNNER_TEMP/morley-login-video" android/app/src/main/res/raw web-assets
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/morley-login-video"
          VIDEO_PATH="$(find "$RUNNER_TEMP/morley-login-video" -type f -iname '*.mp4' | head -n 1)"
          test -n "$VIDEO_PATH" && test -s "$VIDEO_PATH" || { echo 'No MP4 found inside Morley login video ZIP'; exit 1; }
          cp "$VIDEO_PATH" android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
          cp "$VIDEO_PATH" web-assets/morley_buys_login_bg_app.mp4
          test -s android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
          test -s web-assets/morley_buys_login_bg_app.mp4
          echo "Bundled login video: $(du -h android/app/src/main/res/raw/morley_buys_login_bg_app.mp4 | cut -f1)"

      - name: Publish desktop web login video
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-assets/morley_buys_login_bg_app.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Publish desktop login video [skip ci]"
            git push
          fi

      - name: Prepare Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON'; exit 1; }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json >/dev/null

      - name: Run regression tests
        run: gradle -p android testDebugUnitTest --stacktrace --console=plain

      - name: Prepare production signing key
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace --console=plain

      - name: Verify login video packaged in APK
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SOURCE=android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
          test -s "$APK"
          test -s "$SOURCE"
          EXPECTED_BYTES="$(stat -c%s "$SOURCE")"
          unzip -l "$APK" | tee "$RUNNER_TEMP/apk-contents.txt"
          PACKAGED_PATH="$(awk -v size="$EXPECTED_BYTES" '$1 == size && $4 ~ /^res\/.*\.mp4$/ {print $4; exit}' "$RUNNER_TEMP/apk-contents.txt")"
          test -n "$PACKAGED_PATH" || {
            echo "Login background video was not packaged in the APK (expected $EXPECTED_BYTES bytes)"
            exit 1
          }
          echo "Verified login background video in APK as $PACKAGED_PATH ($EXPECTED_BYTES bytes)"

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/B-and-L-Morley-${APP_VERSION_SAFE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: B-and-L-Morley-${{ env.APP_VERSION_SAFE }}
          path: dist/B-and-L-Morley-${{ env.APP_VERSION_SAFE }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_RELEASE_TAG }}
          name: B&L Morley ${{ env.APP_VERSION_NAME }}
          body: |
            B&L Morley production Android release.
            - Deep navy, blue and cyan cyber interface
            - Native Laptop / MacBook and Desktop / Gaming PC valuation tools
            - Persistent valuations and deal tracking
            - Invite-only authentication, OTA updates and signed production APK
            - Morley login video bundled and verified during release build
          files: dist/B-and-L-Morley-${{ env.APP_VERSION_SAFE }}.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish OTA metadata
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          name = os.environ['APP_VERSION_NAME']
          safe = os.environ['APP_VERSION_SAFE']
          code = int(os.environ['APP_VERSION_CODE'])
          tag = os.environ['APP_RELEASE_TAG']
          data = {
              'versionCode': code,
              'versionName': name,
              'apkUrl': f'https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/{tag}/B-and-L-Morley-{safe}.apk',
              'notes': f'B&L Morley {name} production release with the unified navy/blue/cyan cyber interface and current valuation workflow.'
          }
          Path('ota').mkdir(parents=True, exist_ok=True)
          Path('ota/latest.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${APP_VERSION_NAME} OTA metadata [skip ci]"
            git push
          fi
