name: Build B&L Morley APK

on:
  push:
    branches: [ main, native-ota-component-pricing, feature-multisource-evidence, fix-release-signing ]
    paths:
      - 'android/**'
      - 'ota/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ota/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run regression tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Prepare production signing key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.BL_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Remove accidental CR/LF characters introduced by mobile copy/paste.
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_RAW" | tr -d '\r\n')"

          test -n "$KEYSTORE_BASE64" || (echo 'Missing BL_KEYSTORE_BASE64' && exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing BL_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing BL_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing BL_KEY_PASSWORD' && exit 1)

          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          # Fail here with a precise message if the keystore password or alias is wrong.
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo 'Signing validation failed: BL_KEYSTORE_PASSWORD or BL_KEY_ALIAS does not match the decoded keystore.'
            exit 1
          fi

          # Verify the private-key password too without modifying the production keystore.
          VERIFY_STORE="$RUNNER_TEMP/signing-verify.p12"
          if ! keytool -importkeystore \
            -srckeystore "$KEYSTORE_PATH" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$VERIFY_STORE" \
            -deststoretype PKCS12 \
            -deststorepass 'temporary-signing-check-2026' \
            -destkeypass 'temporary-signing-check-2026' \
            -noprompt >/dev/null 2>&1; then
            echo 'Signing validation failed: BL_KEY_PASSWORD does not match the private key.'
            exit 1
          fi
          rm -f "$VERIFY_STORE"

          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/B-and-L-Morley-v2.4.0-native-ota.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-and-L-Morley-Native-v2.4.0-OTA
          path: dist/B-and-L-Morley-v2.4.0-native-ota.apk
          if-no-files-found: error
      - name: Publish v2.4.0 OTA release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: B&L Morley v2.4.0
          body: |
            Native v2.4.0 OTA release.
            - Multi-source valuation evidence and cross-source confidence
            - Safer OEM search broadening and model/generation validation
            - Real-time OTA download progress and APK verification
            - Install/restart update flow
            - Persistent production signing for future OTA compatibility
          files: dist/B-and-L-Morley-v2.4.0-native-ota.apk
          fail_on_unmatched_files: true
          make_latest: true
