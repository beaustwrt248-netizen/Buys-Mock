name: Build B&L Morley APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ota/**'
      - 'morley_buys_login_bg_app.zip'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ota/**'
      - 'morley_buys_login_bg_app.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle Morley login background video
        shell: bash
        run: |
          test -f morley_buys_login_bg_app.zip || { echo 'Missing morley_buys_login_bg_app.zip'; exit 1; }
          rm -rf "$RUNNER_TEMP/morley-login-video"
          mkdir -p "$RUNNER_TEMP/morley-login-video" android/app/src/main/res/raw
          unzip -q -o morley_buys_login_bg_app.zip -d "$RUNNER_TEMP/morley-login-video"
          VIDEO_PATH="$(find "$RUNNER_TEMP/morley-login-video" -type f -iname '*.mp4' | head -n 1)"
          test -n "$VIDEO_PATH" && test -s "$VIDEO_PATH" || { echo 'No MP4 found inside morley_buys_login_bg_app.zip'; exit 1; }
          cp "$VIDEO_PATH" android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
          test -s android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
          echo "Bundled login video: $(du -h android/app/src/main/res/raw/morley_buys_login_bg_app.mp4 | cut -f1)"

      - name: Prepare Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON'; exit 1; }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json >/dev/null

      - name: Run regression tests
        run: gradle -p android testDebugUnitTest --stacktrace --console=plain

      - name: Prepare production signing key
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/bl-morley-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/B-and-L-Morley-v2.6.0-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: B-and-L-Morley-Native-v2.6.0
          path: dist/B-and-L-Morley-v2.6.0-native.apk
          if-no-files-found: error

      - name: Publish v2.6.0 release
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: B&L Morley v2.6.0
          body: |
            Valuation history and deal tracking.
            - Moves valuation/deal history into More to keep the main workspace uncluttered
            - Adds persistent Supabase-backed saved valuations
            - Tracks quoted, bought, sold and passed deals
            - Records actual buy/sell prices, expected profit and actual profit
            - Keeps high-priority heads-up notifications, Turnstile protection, invite-only access and OTA updates
          files: dist/B-and-L-Morley-v2.6.0-native.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish v2.6.0 OTA metadata
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          cat > ota/latest.json <<'EOF'
          {
            "versionCode": 20,
            "versionName": "2.6.0-native",
            "apkUrl": "https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/v2.6.0/B-and-L-Morley-v2.6.0-native.apk",
            "notes": "B&L Morley v2.6.0 adds persistent Valuations & Deals under More, including quoted/bought/sold/passed status and actual profit tracking."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish v2.6.0 OTA metadata [skip ci]"
            git push
          fi
