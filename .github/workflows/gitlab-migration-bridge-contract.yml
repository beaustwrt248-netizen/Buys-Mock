name: GitLab Migration Bridge Contract

on:
  push:
    branches:
      - migration/gitlab-staged-20260914
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/gitlab-migration-bridge.yml'
      - '.github/workflows/gitlab-migration-bridge-contract.yml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.gitlab/ci/*.yml'
      - 'ci/gitlab-parity-manifest.json'
      - 'scripts/ci/check-gitlab-parity-manifest.mjs'
      - 'tests/gitlab-migration-bridge-workflow.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-migration-bridge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify migration bridge safety contract
        run: node --test tests/gitlab-migration-bridge-workflow.test.mjs
      - name: Verify GitLab parity manifest against current workflows
        run: node scripts/ci/check-gitlab-parity-manifest.mjs
