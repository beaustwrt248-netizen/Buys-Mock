name: Deploy B&L Morley Web

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - 'web-assets/**'
      - 'scripts/release_audit.py'
      - '.github/workflows/deploy-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Release readiness audit
        run: python3 scripts/release_audit.py

      - name: Web JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in secure-pricing.js web-auth.js signed-in-user.js web-a11y.js premium-motion.js desktop-parity.js desktop-oem.js workflow.js match-quality.js app.js admin/app.js admin/invites.js admin/targeted-notifications.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Build static web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -v ./*.css site/
          cp -v ./*.js site/
          cp -R admin site/admin
          if [ -d web-assets ]; then cp -R web-assets site/web-assets; fi
          touch site/.nojekyll
          test -s site/index.html
          test -s site/secure-pricing.js
          test -s site/web-auth.js
          test -s site/no-gold.css
          test -s site/web-a11y.js
          test -s site/admin/index.html
          test -s site/admin/app.js
          test -s site/admin/invites.js
          test -s site/admin/styles.css
          test -s site/admin/turnstile.html
          test -s site/web-assets/morley_buys_login_bg_app.mp4
          test "$(stat -c%s site/web-assets/morley_buys_login_bg_app.mp4)" -gt 1000000

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload web site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Post-deploy smoke tests
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          fetch_with_retry() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 30 --output "$out" "$url"; then return 0; fi
              echo "Waiting for Pages propagation ($attempt/6): $url"
              sleep 10
            done
            return 1
          }
          fetch_with_retry "$BASE/" "$RUNNER_TEMP/page-index.html"
          grep -q 'Buys and Loans Hub' "$RUNNER_TEMP/page-index.html"
          grep -q 'secure-pricing.js' "$RUNNER_TEMP/page-index.html"
          fetch_with_retry "$BASE/web-auth.js" "$RUNNER_TEMP/web-auth.js"
          grep -q 'verifyAuthorised' "$RUNNER_TEMP/web-auth.js"
          fetch_with_retry "$BASE/secure-pricing.js" "$RUNNER_TEMP/secure-pricing.js"
          grep -q "localStorage.getItem(STORE)" "$RUNNER_TEMP/secure-pricing.js"
          grep -q "'Authorization':'Bearer '+s.access_token" "$RUNNER_TEMP/secure-pricing.js"
          grep -q 'refreshSession' "$RUNNER_TEMP/secure-pricing.js"
          grep -q 'window.market=secureMarket' "$RUNNER_TEMP/secure-pricing.js"
          fetch_with_retry "$BASE/desktop-oem.js" "$RUNNER_TEMP/desktop-oem.js"
          grep -q "localStorage.getItem('morley_web_auth')" "$RUNNER_TEMP/desktop-oem.js"
          grep -q "'Authorization':'Bearer '+token" "$RUNNER_TEMP/desktop-oem.js"
          fetch_with_retry "$BASE/no-gold.css" "$RUNNER_TEMP/no-gold.css"
          grep -q -- '--yellow:#2f7cff' "$RUNNER_TEMP/no-gold.css"
          fetch_with_retry "$BASE/web-a11y.js" "$RUNNER_TEMP/web-a11y.js"
          grep -q 'focus-visible' "$RUNNER_TEMP/web-a11y.js"
