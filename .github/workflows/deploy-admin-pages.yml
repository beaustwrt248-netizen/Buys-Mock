name: Deploy B&L Morley Web

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'web-base.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - 'web-assets/**'
      - 'scripts/release_audit.py'
      - '.github/workflows/deploy-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release readiness audit
        run: python3 scripts/release_audit.py

      - name: Web JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in secure-pricing.js web-auth.js signed-in-user.js web-a11y.js premium-motion.js desktop-parity.js desktop-oem.js workflow.js match-quality.js app.js product-parity-v3.js ultimate-parity.js mobile-layout-fix.js mobile-app-parity-v4.js mobile-app-parity-v5.js mobile-viewport-lock.js admin/user-management-policy.js admin/app.js admin/login-security.js admin/release-control.js admin/targeted-notifications.js admin/invites.js admin/download-invites.js admin/support-tickets.js admin/audit-triage.js admin/control-governance.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Build static web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp web-base.html site/
          cp -v ./*.css site/
          cp -v ./*.js site/
          cp -R admin site/admin
          if [ -d web-assets ]; then cp -R web-assets site/web-assets; fi
          touch site/.nojekyll
          test -f site/.nojekyll
          test -s site/index.html
          test -s site/web-base.html
          grep -q 'Buys and Loans Hub' site/web-base.html
          test -s site/secure-pricing.js
          test -s site/web-auth.js
          test -s site/no-gold.css
          test -s site/web-a11y.js
          test -s site/product-parity-v3.js
          test -s site/ultimate-parity.js
          test -s site/mobile-parity-v3.css
          test -s site/morley-light-web.css
          test -s site/mobile-layout-fix.js
          test -s site/mobile-app-parity-v4.css
          test -s site/mobile-app-parity-v4.js
          test -s site/mobile-app-parity-v5.css
          test -s site/mobile-app-parity-v5.js
          test -s site/morley-central-pricing.js
          test -s site/web-universal-buy.js
          test -s site/admin/index.html
          test -s site/admin/app.js
          test -s site/admin/invites.js
          test -s site/admin/download-invites.js
          test -s site/admin/login-security.js
          test -s site/admin/release-control.js
          test -s site/admin/support-tickets.js
          test -s site/admin/audit-triage.js
          test -s site/admin/control-governance.js
          test -s site/admin/user-management-policy.js
          test -s site/admin/styles.css
          test -s site/admin/turnstile.html
          test -s site/web-assets/morley_buys_login_bg_app.mp4
          test "$(stat -c%s site/web-assets/morley_buys_login_bg_app.mp4)" -gt 1000000

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload web site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Post-deploy smoke tests
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          echo "Waiting briefly for custom-domain/CDN propagation after successful Pages deployment."
          sleep 20
          fetch_with_retry() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              local sep='?'
              [[ "$url" == *\?* ]] && sep='&'
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                --output "$out" "${url}${sep}morley_sha=${GITHUB_SHA}&attempt=${attempt}"; then return 0; fi
              echo "Waiting for Pages propagation ($attempt/6): $url"
              sleep 10
            done
            return 1
          }
          fetch_until_contains() {
            local url="$1" out="$2" pattern="$3"
            for attempt in 1 2 3 4 5 6; do
              local sep='?'
              [[ "$url" == *\?* ]] && sep='&'
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                --output "$out" "${url}${sep}morley_sha=${GITHUB_SHA}&content_attempt=${attempt}" \
                && grep -Fq -- "$pattern" "$out"; then
                return 0
              fi
              echo "Waiting for expected deployed content ($attempt/6): $url :: $pattern"
              sleep 10
            done
            echo "::error::Expected deployed content not observed after propagation window: $url :: $pattern"
            return 1
          }
          fetch_runtime_until_contains() {
            local url="$1" out="$2" pattern="$3"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                --output "$out" "$url" \
                && grep -Fq -- "$pattern" "$out"; then
                return 0
              fi
              echo "Waiting for exact runtime content ($attempt/6): $url :: $pattern"
              sleep 10
            done
            echo "::error::Exact runtime URL did not expose expected deployed content: $url :: $pattern"
            return 1
          }
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" "const CANDIDATE='web-base.html'"
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'secure-pricing.js'
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'mobile-parity-v3.css'
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'morley-light-web.css'
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'mobile-layout-fix.js'
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'mobile-app-parity-v4.css?v='
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'mobile-app-parity-v4.js?v='
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'mobile-app-parity-v5.css?v=202609041'
          fetch_until_contains "$BASE/" "$RUNNER_TEMP/page-index.html" 'mobile-app-parity-v5.js?v=202609041'
          fetch_runtime_until_contains "$BASE/web-base.html" "$RUNNER_TEMP/web-base.html" 'Buys and Loans Hub'
          fetch_until_contains "$BASE/web-auth.js" "$RUNNER_TEMP/web-auth.js" 'verifyAuthorised'
          fetch_until_contains "$BASE/secure-pricing.js" "$RUNNER_TEMP/secure-pricing.js" 'localStorage.getItem(STORE)'
          fetch_until_contains "$BASE/secure-pricing.js" "$RUNNER_TEMP/secure-pricing.js" "'Authorization':'Bearer '+s.access_token"
          fetch_until_contains "$BASE/secure-pricing.js" "$RUNNER_TEMP/secure-pricing.js" 'refreshSession'
          fetch_until_contains "$BASE/secure-pricing.js" "$RUNNER_TEMP/secure-pricing.js" 'window.market=secureMarket'
          fetch_until_contains "$BASE/product-parity-v3.js" "$RUNNER_TEMP/product-parity-v3.js" 'Computer Pricing'
          fetch_until_contains "$BASE/product-parity-v3.js" "$RUNNER_TEMP/product-parity-v3.js" 'Console Pricing'
          fetch_until_contains "$BASE/product-parity-v3.js" "$RUNNER_TEMP/product-parity-v3.js" 'mobileAndroidOwner'
          fetch_until_contains "$BASE/ultimate-parity.js" "$RUNNER_TEMP/ultimate-parity.js" 'Help & FAQ'
          fetch_until_contains "$BASE/mobile-layout-fix.js" "$RUNNER_TEMP/mobile-layout-fix.js" 'parityV5OwnsMobile'
          node --check "$RUNNER_TEMP/mobile-layout-fix.js"
          fetch_until_contains "$BASE/mobile-app-parity-v4.js" "$RUNNER_TEMP/mobile-app-parity-v4.js" 'home|categories|general|settings'
          node --check "$RUNNER_TEMP/mobile-app-parity-v4.js"
          fetch_until_contains "$BASE/mobile-app-parity-v5.js" "$RUNNER_TEMP/mobile-app-parity-v5.js" "const NAV_SIGNATURE='home|categories|general|settings'"
          fetch_until_contains "$BASE/mobile-app-parity-v5.js" "$RUNNER_TEMP/mobile-app-parity-v5.js" "document.body.id='morleyMobileParityRoot'"
          fetch_until_contains "$BASE/mobile-app-parity-v5.js" "$RUNNER_TEMP/mobile-app-parity-v5.js" 'function navSignature(nav)'
          fetch_until_contains "$BASE/mobile-app-parity-v5.js" "$RUNNER_TEMP/mobile-app-parity-v5.js" 'morleyAndroidHomeExtras'
          fetch_until_contains "$BASE/mobile-app-parity-v5.js" "$RUNNER_TEMP/mobile-app-parity-v5.js" 'A / B / C / Luxury buying targets'
          node --check "$RUNNER_TEMP/mobile-app-parity-v5.js"
          fetch_until_contains "$BASE/mobile-app-parity-v5.css" "$RUNNER_TEMP/mobile-app-parity-v5.css" '--morley-v5-accent:#167a5a'
          fetch_until_contains "$BASE/mobile-app-parity-v5.css" "$RUNNER_TEMP/mobile-app-parity-v5.css" 'body#morleyMobileParityRoot button{background-image:none!important}'
          fetch_until_contains "$BASE/mobile-app-parity-v5.css" "$RUNNER_TEMP/mobile-app-parity-v5.css" 'nav#morleyBottomNav'
          ! grep -Eqi '#2875ff|#2f7cff|#16c7ff|#12c9ff|#1f5fd8|#1f63e2|#12aeea' "$RUNNER_TEMP/mobile-app-parity-v5.css"
          fetch_until_contains "$BASE/mobile-viewport-lock.js" "$RUNNER_TEMP/mobile-viewport-lock.js" 'keep this helper immediately'
          node --check "$RUNNER_TEMP/mobile-viewport-lock.js"
          fetch_until_contains "$BASE/mobile-app-parity-v4.css" "$RUNNER_TEMP/mobile-app-parity-v4.css" '--morley-v4-accent:#167a5a'
          ! grep -Eqi '#2875ff|#2f7cff|#16c7ff|#12c9ff|#1f5fd8' "$RUNNER_TEMP/mobile-app-parity-v4.css"
          fetch_until_contains "$BASE/mobile-parity-v3.css" "$RUNNER_TEMP/mobile-parity-v3.css" '@media(max-width:760px)'
          fetch_until_contains "$BASE/mobile-parity-v3.css" "$RUNNER_TEMP/mobile-parity-v3.css" 'grid-template-columns:repeat(4,minmax(0,1fr))'
          fetch_until_contains "$BASE/mobile-parity-v3.css" "$RUNNER_TEMP/mobile-parity-v3.css" '.modal.open,.morley-menu-dialog.open,.msw-dialog.open'
          fetch_until_contains "$BASE/morley-light-web.css" "$RUNNER_TEMP/morley-light-web.css" 'color-scheme:light'
          fetch_until_contains "$BASE/morley-light-web.css" "$RUNNER_TEMP/morley-light-web.css" '#morleyWebAuth'
          fetch_until_contains "$BASE/desktop-oem.js" "$RUNNER_TEMP/desktop-oem.js" "localStorage.getItem('morley_web_auth')"
          fetch_until_contains "$BASE/desktop-oem.js" "$RUNNER_TEMP/desktop-oem.js" "'Authorization':'Bearer '+token"
          fetch_until_contains "$BASE/no-gold.css" "$RUNNER_TEMP/no-gold.css" '--yellow:#2f7cff'
          fetch_until_contains "$BASE/web-a11y.js" "$RUNNER_TEMP/web-a11y.js" 'focus-visible'
          fetch_until_contains "$BASE/desktop-parity.js" "$RUNNER_TEMP/desktop-parity.js" 'morley-section-back'
          ! grep -Eqi '#ffd400|#ffe65b|#ffd000|#c99a27|#cda51d' "$RUNNER_TEMP/desktop-parity.js"
          fetch_until_contains "$BASE/admin/turnstile.html" "$RUNNER_TEMP/turnstile.html" 'postMessage(payload,postMessageOrigin)'
          fetch_until_contains "$BASE/admin/index.html" "$RUNNER_TEMP/admin-index.html" 'styles.css?v=3'
          fetch_until_contains "$BASE/admin/index.html" "$RUNNER_TEMP/admin-index.html" 'app.js?v=4'
          fetch_until_contains "$BASE/admin/index.html" "$RUNNER_TEMP/admin-index.html" 'id="inviteName"'
          fetch_until_contains "$BASE/admin/index.html" "$RUNNER_TEMP/admin-index.html" 'First and last name'
          fetch_until_contains "$BASE/admin/index.html" "$RUNNER_TEMP/admin-index.html" 'invites.js?v=3'
          fetch_until_contains "$BASE/admin/invites.js" "$RUNNER_TEMP/admin-invites.js" 'display_name:name'
          fetch_until_contains "$BASE/admin/invites.js" "$RUNNER_TEMP/admin-invites.js" 'inviteName'
          fetch_until_contains "$BASE/admin/app.js" "$RUNNER_TEMP/admin-app.js" "secureUserAction('set_role'"
          fetch_until_contains "$BASE/admin/app.js" "$RUNNER_TEMP/admin-app.js" "secureUserAction('set_display_name'"
          fetch_until_contains "$BASE/admin/app.js" "$RUNNER_TEMP/admin-app.js" 'data-name-save'
          fetch_until_contains "$BASE/admin/app.js" "$RUNNER_TEMP/admin-app.js" 'admin-user-control'
          ! grep -q "sb.rpc('admin_set_user_role'" "$RUNNER_TEMP/admin-app.js"
          fetch_with_retry "$BASE/admin/styles.css" "$RUNNER_TEMP/admin-styles.css"
          ! grep -Eqi '#ffd400|#ffe65b|#ffd000|#c99a27|#cda51d' "$RUNNER_TEMP/admin-styles.css"
