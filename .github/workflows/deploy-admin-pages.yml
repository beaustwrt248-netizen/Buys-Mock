name: Deploy B&L Morley Web

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'web-base.html'
      - '*.css'
      - '*.js'
      - 'admin/**'
      - 'web-assets/**'
      - 'scripts/release_audit.py'
      - '.github/workflows/deploy-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Release readiness audit
        run: python3 scripts/release_audit.py

      - name: Web JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in secure-pricing.js web-auth.js signed-in-user.js web-a11y.js premium-motion.js desktop-parity.js desktop-oem.js workflow.js match-quality.js app.js product-parity-v3.js ultimate-parity.js mobile-layout-fix.js admin/user-management-policy.js admin/app.js admin/login-security.js admin/release-control.js admin/targeted-notifications.js admin/invites.js admin/download-invites.js admin/support-tickets.js admin/audit-triage.js admin/control-governance.js; do
            test -s "$file"
            node --check "$file"
          done

      - name: Build static web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp web-base.html site/
          cp -v ./*.css site/
          cp -v ./*.js site/
          cp -R admin site/admin
          if [ -d web-assets ]; then cp -R web-assets site/web-assets; fi
          touch site/.nojekyll
          test -f site/.nojekyll
          test -s site/index.html
          test -s site/web-base.html
          grep -q 'Buys and Loans Hub' site/web-base.html
          test -s site/secure-pricing.js
          test -s site/web-auth.js
          test -s site/no-gold.css
          test -s site/web-a11y.js
          test -s site/product-parity-v3.js
          test -s site/ultimate-parity.js
          test -s site/mobile-parity-v3.css
          test -s site/morley-light-web.css
          test -s site/mobile-layout-fix.js
          test -s site/admin/index.html
          test -s site/admin/app.js
          test -s site/admin/invites.js
          test -s site/admin/download-invites.js
          test -s site/admin/login-security.js
          test -s site/admin/release-control.js
          test -s site/admin/support-tickets.js
          test -s site/admin/audit-triage.js
          test -s site/admin/control-governance.js
          test -s site/admin/user-management-policy.js
          test -s site/admin/styles.css
          test -s site/admin/turnstile.html
          test -s site/web-assets/morley_buys_login_bg_app.mp4
          test "$(stat -c%s site/web-assets/morley_buys_login_bg_app.mp4)" -gt 1000000

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload web site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Post-deploy smoke tests
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          echo "Waiting briefly for custom-domain/CDN propagation after successful Pages deployment."
          sleep 20
          fetch_until_matches_deployed() {
            local url="$1" out="$2" expected="$3"
            for attempt in 1 2 3 4 5 6; do
              local sep='?'
              [[ "$url" == *\?* ]] && sep='&'
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                --output "$out" "${url}${sep}morley_sha=${GITHUB_SHA}&artifact_attempt=${attempt}" \
                && cmp -s "$out" "$expected"; then
                return 0
              fi
              echo "Waiting for exact deployed artifact ($attempt/6): $url"
              if [[ -s "$out" ]]; then
                echo "Expected SHA-256: $(sha256sum "$expected" | awk '{print $1}')"
                echo "Observed SHA-256: $(sha256sum "$out" | awk '{print $1}')"
              fi
              sleep 10
            done
            echo "::error::Deployed asset did not match the exact uploaded artifact: $url"
            return 1
          }
          fetch_runtime_until_matches_deployed() {
            local url="$1" out="$2" expected="$3"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                --output "$out" "$url" \
                && cmp -s "$out" "$expected"; then
                return 0
              fi
              echo "Waiting for exact runtime artifact ($attempt/6): $url"
              if [[ -s "$out" ]]; then
                echo "Expected SHA-256: $(sha256sum "$expected" | awk '{print $1}')"
                echo "Observed SHA-256: $(sha256sum "$out" | awk '{print $1}')"
              fi
              sleep 10
            done
            echo "::error::Exact runtime URL did not match the uploaded artifact: $url"
            return 1
          }
          fetch_until_matches_deployed "$BASE/" "$RUNNER_TEMP/page-index.html" site/index.html
          grep -q 'web-base.html' "$RUNNER_TEMP/page-index.html"
          grep -q 'secure-pricing.js' "$RUNNER_TEMP/page-index.html"
          grep -q 'mobile-parity-v3.css' "$RUNNER_TEMP/page-index.html"
          grep -q 'morley-light-web.css' "$RUNNER_TEMP/page-index.html"
          grep -q 'mobile-layout-fix.js' "$RUNNER_TEMP/page-index.html"
          grep -q 'web-laptop-fair-buy-zone.js?v=1' "$RUNNER_TEMP/page-index.html"
          fetch_runtime_until_matches_deployed "$BASE/web-base.html" "$RUNNER_TEMP/web-base.html" site/web-base.html
          grep -q 'Buys and Loans Hub' "$RUNNER_TEMP/web-base.html"
          fetch_until_matches_deployed "$BASE/web-auth.js" "$RUNNER_TEMP/web-auth.js" site/web-auth.js
          grep -q 'verifyAuthorised' "$RUNNER_TEMP/web-auth.js"
          fetch_until_matches_deployed "$BASE/secure-pricing.js" "$RUNNER_TEMP/secure-pricing.js" site/secure-pricing.js
          grep -q "localStorage.getItem(STORE)" "$RUNNER_TEMP/secure-pricing.js"
          grep -q "'Authorization':'Bearer '+s.access_token" "$RUNNER_TEMP/secure-pricing.js"
          grep -q 'refreshSession' "$RUNNER_TEMP/secure-pricing.js"
          grep -q 'window.market=secureMarket' "$RUNNER_TEMP/secure-pricing.js"
          fetch_until_matches_deployed "$BASE/product-parity-v3.js" "$RUNNER_TEMP/product-parity-v3.js" site/product-parity-v3.js
          grep -q 'Computer Pricing' "$RUNNER_TEMP/product-parity-v3.js"
          grep -q 'Console Pricing' "$RUNNER_TEMP/product-parity-v3.js"
          fetch_until_matches_deployed "$BASE/ultimate-parity.js" "$RUNNER_TEMP/ultimate-parity.js" site/ultimate-parity.js
          grep -q 'Help & FAQ' "$RUNNER_TEMP/ultimate-parity.js"
          fetch_until_matches_deployed "$BASE/mobile-layout-fix.js" "$RUNNER_TEMP/mobile-layout-fix.js" site/mobile-layout-fix.js
          grep -q 'home|computer|console|general' "$RUNNER_TEMP/mobile-layout-fix.js"
          node --check "$RUNNER_TEMP/mobile-layout-fix.js"
          fetch_until_matches_deployed "$BASE/mobile-parity-v3.css" "$RUNNER_TEMP/mobile-parity-v3.css" site/mobile-parity-v3.css
          grep -q '@media(max-width:760px)' "$RUNNER_TEMP/mobile-parity-v3.css"
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' "$RUNNER_TEMP/mobile-parity-v3.css"
          grep -q '.modal.open,.morley-menu-dialog.open,.msw-dialog.open' "$RUNNER_TEMP/mobile-parity-v3.css"
          fetch_until_matches_deployed "$BASE/morley-light-web.css" "$RUNNER_TEMP/morley-light-web.css" site/morley-light-web.css
          grep -q 'color-scheme:light' "$RUNNER_TEMP/morley-light-web.css"
          grep -q '#morleyWebAuth' "$RUNNER_TEMP/morley-light-web.css"
          fetch_until_matches_deployed "$BASE/desktop-oem.js" "$RUNNER_TEMP/desktop-oem.js" site/desktop-oem.js
          grep -q "localStorage.getItem('morley_web_auth')" "$RUNNER_TEMP/desktop-oem.js"
          grep -q "'Authorization':'Bearer '+token" "$RUNNER_TEMP/desktop-oem.js"
          fetch_until_matches_deployed "$BASE/no-gold.css" "$RUNNER_TEMP/no-gold.css" site/no-gold.css
          grep -q -- '--yellow:#2f7cff' "$RUNNER_TEMP/no-gold.css"
          fetch_until_matches_deployed "$BASE/web-a11y.js" "$RUNNER_TEMP/web-a11y.js" site/web-a11y.js
          grep -q 'focus-visible' "$RUNNER_TEMP/web-a11y.js"
          fetch_until_matches_deployed "$BASE/desktop-parity.js" "$RUNNER_TEMP/desktop-parity.js" site/desktop-parity.js
          grep -q 'morley-section-back' "$RUNNER_TEMP/desktop-parity.js"
          ! grep -Eqi '#ffd400|#ffe65b|#ffd000|#c99a27|#cda51d' "$RUNNER_TEMP/desktop-parity.js"
          fetch_until_matches_deployed "$BASE/admin/turnstile.html" "$RUNNER_TEMP/turnstile.html" site/admin/turnstile.html
          grep -q 'postMessage(payload,postMessageOrigin)' "$RUNNER_TEMP/turnstile.html"
          fetch_until_matches_deployed "$BASE/admin/index.html" "$RUNNER_TEMP/admin-index.html" site/admin/index.html
          grep -q 'styles.css?v=3' "$RUNNER_TEMP/admin-index.html"
          grep -q 'app.js?v=4' "$RUNNER_TEMP/admin-index.html"
          grep -q 'id="inviteName"' "$RUNNER_TEMP/admin-index.html"
          grep -q 'First and last name' "$RUNNER_TEMP/admin-index.html"
          grep -q 'invites.js?v=3' "$RUNNER_TEMP/admin-index.html"
          fetch_until_matches_deployed "$BASE/admin/invites.js" "$RUNNER_TEMP/admin-invites.js" site/admin/invites.js
          grep -q 'display_name:name' "$RUNNER_TEMP/admin-invites.js"
          grep -q 'inviteName' "$RUNNER_TEMP/admin-invites.js"
          fetch_until_matches_deployed "$BASE/admin/app.js" "$RUNNER_TEMP/admin-app.js" site/admin/app.js
          grep -q "secureUserAction('set_role'" "$RUNNER_TEMP/admin-app.js"
          grep -q "secureUserAction('set_display_name'" "$RUNNER_TEMP/admin-app.js"
          grep -q 'data-name-save' "$RUNNER_TEMP/admin-app.js"
          grep -q 'admin-user-control' "$RUNNER_TEMP/admin-app.js"
          ! grep -q "sb.rpc('admin_set_user_role'" "$RUNNER_TEMP/admin-app.js"
          fetch_until_matches_deployed "$BASE/admin/styles.css" "$RUNNER_TEMP/admin-styles.css" site/admin/styles.css
          ! grep -Eqi '#ffd400|#ffe65b|#ffd000|#c99a27|#cda51d' "$RUNNER_TEMP/admin-styles.css"
