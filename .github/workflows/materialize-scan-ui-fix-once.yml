name: Materialize Scan UI Fix Once

on:
  push:
    branches:
      - fix/morley-buys-scan-ui-20260915
    paths:
      - .github/workflows/materialize-scan-ui-fix-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/morley-buys-scan-ui-20260915
          fetch-depth: 0
      - name: Apply reviewed source patch
        run: python3 scripts/tmp_materialize_scan_ui_fix.py
      - name: Commit tracked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/buysloans/hub/DeviceLensActivity.kt android/app/src/main/java/com/buysloans/hub/MorleyVisionReviewUi.kt
          git diff --cached --check
          git commit -m "fix: respect scan safe areas and prioritise recovery"
          git push origin HEAD:fix/morley-buys-scan-ui-20260915
