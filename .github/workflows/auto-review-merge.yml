name: Guarded Auto Review & Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-and-arm-automerge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Classify change risk from paths and diff
        id: risk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          files=json.loads(Path(os.environ['RUNNER_TEMP'],'pr-files.json').read_text())
          names=[f.get('filename','') for f in files]
          patches='\n'.join(f.get('patch') or '' for f in files)
          added='\n'.join(
              line[1:] for line in patches.splitlines()
              if line.startswith('+') and not line.startswith('+++')
          )

          guarded_path=re.compile(
              r'(^|/)(auth|security|permissions?|migrations?|guardian)(/|$)|'
              r'^\.github/workflows/|^\.github/CODEOWNERS$|'
              r'^supabase/(migrations/|functions/)|'
              r'^ota/|(^|/)(release|releases|release[-_]?metadata|ota)(/|$)|'
              r'(^|/)(privileged[-_]?roles?|role[-_]?grants?|pricing[-_]?approval|price[-_]?approval)(/|$)|'
              r'(^|/)AndroidManifest\.xml$|(^|/)build\.gradle$', re.I)

          critical_path=re.compile(
              r'(^|/)\.env($|\.)|(^|/)(credentials?|private[-_]?keys?|keystore|signing[-_]?keys?)(/|$)|'
              r'\.(jks|keystore|p12|pfx|pem|key)$', re.I)

          critical_added=[
              r'\bdisable\s+row\s+level\s+security\b',
              r'\bgrant\s+all\b.*\b(to|role)\s+(anon|authenticated|public)\b',
              r'\bservice[_-]?role\b',
              r'\bdrop\s+(table|schema|database)\b',
              r'\btruncate\s+(table\s+)?\w+',
              r'\bdelete\s+from\s+\w+\s*;?$',
              r'\bforce[-_ ]?push\b',
              r'authority_expansion\s*[:=]\s*true',
              r'raw_(evidence|prices|user_backups)_exposed\s*[:=]\s*true',
              r'persist-credentials\s*:\s*true',
          ]

          critical=[]
          for name in names:
              if critical_path.search(name): critical.append(name)
          for pattern in critical_added:
              if re.search(pattern, added, re.I|re.M): critical.append(f'diff:{pattern}')

          guarded=[n for n in names if guarded_path.search(n)]
          level='critical' if critical else ('guarded' if guarded else 'routine')

          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f'level={level}\n')
              fh.write('critical<<EOF\n' + '\n'.join(critical) + '\nEOF\n')
              fh.write('guarded<<EOF\n' + '\n'.join(guarded) + '\nEOF\n')
          print(f'Risk level: {level}')
          if guarded: print('Guarded paths:\n'+'\n'.join(guarded))
          if critical: print('Critical stops:\n'+'\n'.join(critical))
          PY

      - name: Stop only trust-breaking or destructive changes
        if: steps.risk.outputs.level == 'critical'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "🛑 **Critical autonomy stop.**\n\nThis PR contains a destructive, credential/signing, or trust-boundary change that Morley Autopilot will not merge automatically.\n\nDetected:\n\`\`\`\n${{ steps.risk.outputs.critical }}\n\`\`\`"
          exit 1

      - name: Record guarded manual-review boundary
        if: steps.risk.outputs.level == 'guarded'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "🛡️ **Protected change detected. Manual approval required.** Sensitive auth/authorization, RLS/migration, workflow security, release/OTA, privileged-role, pricing-approval, Guardian, manifest or build paths are not auto-approved or auto-merged. Existing security, parity, release and branch checks remain authoritative."

      - name: Automatic approval for routine changes only
        if: steps.risk.outputs.level == 'routine'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr review "$PR" --repo "$REPO" --approve --body "✅ Morley Autopilot routine-change policy review passed. Required checks and branch protections remain authoritative."

      - name: Enable auto-merge for routine changes only
        if: steps.risk.outputs.level == 'routine'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --squash

      - name: Summary
        shell: bash
        run: |
          echo "### Morley Autopilot risk: ${{ steps.risk.outputs.level }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.risk.outputs.level }}" == "critical" ]]; then
            echo "Automatic merge blocked because the change can alter trust, credentials/signing, or production data destructively." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.risk.outputs.level }}" == "guarded" ]]; then
            echo "Manual approval required. Protected changes are neither auto-approved nor auto-merged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Routine change: auto-merge may be armed, but required checks and repository protections must still pass." >> "$GITHUB_STEP_SUMMARY"
          fi
