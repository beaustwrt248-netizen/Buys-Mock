name: Nova Next APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'nova-next/android/**'
      - 'nova-next/nova-update.json'
      - '.github/workflows/nova-next-apk-build.yml'
  push:
    branches: [ main ]
    paths:
      - 'nova-next/android/**'
      - 'nova-next/nova-update.json'
      - '.github/workflows/nova-next-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nova-next-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      app_changed: ${{ steps.change.outputs.changed }}
    steps:
      - name: Checkout exact review source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect Nova Next Android source change
        id: change
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "${GITHUB_SHA}^" "$GITHUB_SHA" -- \
            nova-next/android/app/build.gradle \
            nova-next/android/app/proguard-rules.pro \
            nova-next/android/app/src/main; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.3.1'

      - name: Run Nova Next contracts, tests and lint
        shell: bash
        run: |
          set -euo pipefail
          node --test nova-next/tests/*.test.mjs
          gradle --no-daemon --project-dir nova-next/android \
            :app:testDebugUnitTest \
            :app:lintDebug \
            --stacktrace --console=plain

      - name: Build Nova Next debug APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir nova-next/android \
            :app:assembleDebug \
            --stacktrace --console=plain

      - name: Stage Nova Next PR APK
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('nova-next/android/app/build.gradle').read_text(encoding='utf-8')
          match=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", text)
          if not match: raise SystemExit('Missing Nova Next versionName')
          print(match.group(1))
          PY
          )"
          mkdir -p dist
          APK_NAME="Nova-Next-${VERSION_NAME}-debug.apk"
          cp nova-next/android/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && sha256sum --check "$APK_NAME.sha256")

      - name: Upload Nova Next PR APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-next-debug-apk
          path: dist/Nova-Next-*-debug.apk*
          if-no-files-found: error
          retention-days: 14

  publish-nova-next-ota:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: build-nova-next-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout exact Nova Next release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.3.1'

      - name: Resolve guarded Nova Next release identity
        env:
          # versionCode 1 / Nova Next 0.1.0 is permanently unusable because its
          # historical release tag did not target the exact APK build source.
          # Keep this allow-list explicit: arbitrary version skips remain rejected.
          NOVA_NEXT_QUARANTINED_VERSION_CODES: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          gradle=Path('nova-next/android/app/build.gradle').read_text(encoding='utf-8')
          code=re.search(r'\bversionCode\s+(\d+)', gradle)
          name=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", gradle)
          if not code or not name:
              raise SystemExit('Invalid Nova Next release identity')
          current_code=int(code.group(1)); current_name=name.group(1).strip()
          if not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z._-]*', current_name):
              raise SystemExit('Nova Next versionName contains unsafe release-path characters')

          metadata=json.loads(Path('nova-next/nova-update.json').read_text(encoding='utf-8'))
          if metadata.get('appId') != 'nova-next':
              raise SystemExit('Nova Next OTA appId mismatch')
          if metadata.get('channel') != 'stable':
              raise SystemExit('Nova Next OTA channel mismatch')
          if metadata.get('packageName') != 'com.buysloans.novanext':
              raise SystemExit('Nova Next OTA package identity mismatch')
          published_code=metadata.get('versionCode')
          if isinstance(published_code, bool) or not isinstance(published_code, int):
              raise SystemExit('Nova Next published versionCode is invalid')

          raw_quarantine=os.environ.get('NOVA_NEXT_QUARANTINED_VERSION_CODES', '')
          quarantined_codes=set()
          for value in raw_quarantine.split(','):
              value=value.strip()
              if not value:
                  continue
              if not value.isdigit():
                  raise SystemExit('Nova Next quarantined versionCode list is invalid')
              quarantined_codes.add(int(value))

          next_code=published_code + 1
          while next_code in quarantined_codes:
              next_code += 1
          if current_code != next_code:
              raise SystemExit(
                  f'Nova Next source versionCode {current_code} must equal next publishable OTA code {next_code}; '
                  f'published={published_code}, quarantined={sorted(quarantined_codes)}.'
              )

          safe=re.sub(r'[^A-Za-z0-9._-]+','-',current_name).strip('-')
          values={
              'NOVA_NEXT_VERSION_CODE': str(current_code),
              'NOVA_NEXT_VERSION_NAME': current_name,
              'NOVA_NEXT_VERSION_SAFE': safe,
              'NOVA_NEXT_RELEASE_TAG': f'nova-next-v{safe}',
              'NOVA_NEXT_RELEASE_FILE': f'Nova-Next-{safe}.apk',
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              for key,value in values.items(): fh.write(f'{key}={value}\n')
          PY

      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASSWORD_RAW: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BL_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_BASE64="$(printf '%s' "$KEYSTORE_BASE64_RAW" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
          KEYSTORE_PATH="$RUNNER_TEMP/nova-next-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "B_AND_L_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "B_AND_L_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "B_AND_L_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build stable signed Nova Next release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir nova-next/android \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            --stacktrace --console=plain

      - name: Stage and verify Nova Next release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp nova-next/android/app/build/outputs/apk/release/app-release.apk "dist/${NOVA_NEXT_RELEASE_FILE}"
          (cd dist && sha256sum "$NOVA_NEXT_RELEASE_FILE" > "$NOVA_NEXT_RELEASE_FILE.sha256" && sha256sum --check "$NOVA_NEXT_RELEASE_FILE.sha256")

          EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "dist/${NOVA_NEXT_RELEASE_FILE}")"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          NOVA_NEXT_SHA256="$(sha256sum "dist/${NOVA_NEXT_RELEASE_FILE}" | awk '{print $1}')"
          echo "NOVA_NEXT_SHA256=$NOVA_NEXT_SHA256" >> "$GITHUB_ENV"

      - name: Publish immutable Nova Next GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # A release tag is immutable provenance. If it already exists, it must
          # resolve to this exact release source before we refuse identity reuse.
          NOVA_NEXT_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$NOVA_NEXT_RELEASE_TAG" --jq .sha 2>/dev/null || true)"
          if [ -n "$NOVA_NEXT_TAG_SHA" ] && [ "$NOVA_NEXT_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Refusing Nova Next release: tag $NOVA_NEXT_RELEASE_TAG resolves to $NOVA_NEXT_TAG_SHA and does not match source $GITHUB_SHA." >&2
            exit 1
          fi

          if gh release view "$NOVA_NEXT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Nova Next release tag $NOVA_NEXT_RELEASE_TAG already exists; refusing version identity reuse." >&2
            exit 1
          fi
          gh release create "$NOVA_NEXT_RELEASE_TAG" \
            "dist/${NOVA_NEXT_RELEASE_FILE}" \
            "dist/${NOVA_NEXT_RELEASE_FILE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nova Next ${NOVA_NEXT_VERSION_NAME}" \
            --notes "Verified Nova Next Android OTA release. Built from ${GITHUB_SHA}; tests, lint, stable signer verification, package identity checks and SHA-256 integrity verification passed." \
            --latest=false

          # Verify provenance after publication as well, before OTA metadata can
          # be staged for protected promotion.
          NOVA_NEXT_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$NOVA_NEXT_RELEASE_TAG" --jq .sha)"
          test "$NOVA_NEXT_TAG_SHA" = "$GITHUB_SHA" || { echo "Nova Next release tag $NOVA_NEXT_RELEASE_TAG does not match source $GITHUB_SHA" >&2; exit 1; }

      - name: Stage guarded Nova Next OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release_file=os.environ['NOVA_NEXT_RELEASE_FILE']
          data={
              'appId': 'nova-next',
              'channel': 'stable',
              'packageName': 'com.buysloans.novanext',
              'versionCode': int(os.environ['NOVA_NEXT_VERSION_CODE']),
              'versionName': os.environ['NOVA_NEXT_VERSION_NAME'],
              'downloadUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['NOVA_NEXT_RELEASE_TAG']}/{release_file}",
              'sha256': os.environ['NOVA_NEXT_SHA256'],
              'mandatory': False,
              'notes': f"Nova Next {os.environ['NOVA_NEXT_VERSION_NAME']} is available."
          }
          Path('dist/nova-update.json').write_text(json.dumps(data, indent=2)+"\n", encoding='utf-8')
          PY

      - name: Verify staged OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data=json.loads(Path('dist/nova-update.json').read_text(encoding='utf-8'))
          expected_url=(
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['NOVA_NEXT_RELEASE_TAG']}/{os.environ['NOVA_NEXT_RELEASE_FILE']}"
          )
          assert data['appId'] == 'nova-next'
          assert data['channel'] == 'stable'
          assert data['packageName'] == 'com.buysloans.novanext'
          assert data['versionCode'] == int(os.environ['NOVA_NEXT_VERSION_CODE'])
          assert data['versionName'] == os.environ['NOVA_NEXT_VERSION_NAME']
          assert data['downloadUrl'] == expected_url
          assert re.fullmatch(r'[0-9a-f]{64}', data['sha256'])
          PY

      - name: Upload guarded Nova Next OTA metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-next-ota-metadata-${{ env.NOVA_NEXT_VERSION_SAFE }}
          path: dist/nova-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Record protected promotion handoff
        shell: bash
        run: |
          set -euo pipefail
          echo "Verified Nova Next OTA metadata is staged in artifact nova-next-ota-metadata-${NOVA_NEXT_VERSION_SAFE}."
          echo "Repository rules require nova-next/nova-update.json promotion through a reviewed pull request; no direct protected-branch write is attempted."
