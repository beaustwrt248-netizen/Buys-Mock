name: Web No-Blue / Morley Layout Contract

on:
  push:
    branches: [ main ]
    paths:
      - '*.css'
      - '*.js'
      - 'index.html'
      - 'tests/desktop-dashboard-contract.test.js'
      - '.github/workflows/web-no-blue-filter.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '*.css'
      - '*.js'
      - 'index.html'
      - 'tests/desktop-dashboard-contract.test.js'
      - '.github/workflows/web-no-blue-filter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morley-visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify emerald theme and responsive layout contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden=['#2f7cff','#1f5fd8','#12c9ff','#2468dd','#2875ff','#16c7ff','#70dfff','#7bdfff','rgba(47,124,255','rgba(18,201,255','rgb(47,124,255','rgb(18,201,255']
          active=['cyber-ui.css','cyber-spectrum.css','reference-theme.css','morley-light-web.css','web-apk-light-visual-lock.css','mobile-menu-theme-lock.css','morley-desktop-dashboard.css']
          failures=[]
          for file in active:
              text=Path(file).read_text(encoding='utf-8').lower()
              found=[token for token in forbidden if token in text]
              if found: failures.append(f'{file}: {", ".join(found)}')
          if failures: raise SystemExit('Retired electric blue/cyan theme token detected:\n'+'\n'.join(failures))
          for legacy in ['cyber-ui.css','cyber-spectrum.css','reference-theme.css']:
              if 'Retired production theme shim' not in Path(legacy).read_text(encoding='utf-8'):
                  raise SystemExit(f'{legacy} must remain retired and neutral')

          mobile=Path('mobile-viewport-lock.css').read_text(encoding='utf-8')
          mobile_required=['html.morley-physical-phone','max-height:60px','grid-template-columns:repeat(4,minmax(0,1fr))','padding-bottom:calc(82px + env(safe-area-inset-bottom))']
          missing=[needle for needle in mobile_required if needle not in mobile]
          if missing: raise SystemExit('Mobile contract missing: '+', '.join(missing))

          lock=Path('web-apk-light-visual-lock.css').read_text(encoding='utf-8')
          required=['#inventory #addItem','#scanner #startScan','#scanner #findCode','#morleyMenuDialog button','#morleyMoreBackBar button','nav[aria-label="Primary navigation"]','button.secondary','button.danger']
          missing=[needle for needle in required if needle not in lock]
          if missing: raise SystemExit('Shared component coverage missing: '+', '.join(missing))

          desktop=Path('morley-desktop-dashboard.css').read_text(encoding='utf-8')
          desktop_required=['@media (min-width:1000px)','#morleyDesktopShell','margin:0 0 0 272px','--morley-dash-emerald','#home>.stats','.desktop-more-grid','table{width:100%','#morleyMenuTrigger','.desktop-header-actions{display:none!important','.msi-fill{background:linear-gradient(90deg,#087a55','.desktop-side-status{margin-top:auto!important','.morley-dashboard-nav-icon svg{display:block!important','#desktopPricingState','color:#7fe2bb!important','.morley-web-signout{background:#b44552!important','.morley-menu-signout{background:#b44552!important']
          missing=[needle for needle in desktop_required if needle not in desktop]
          if missing: raise SystemExit('Desktop finance dashboard contract missing: '+', '.join(missing))
          if '@media (max-width:760px)' in desktop:
              raise SystemExit('Desktop dashboard must not override the <=760px mobile contract')

          dashboard_js=Path('morley-desktop-dashboard.js').read_text(encoding='utf-8')
          for route in ['Dashboard','Computer Pricing','Console Pricing','General Buys','Saved Deals','Inventory','Scanner','Sales','More']:
              if route not in dashboard_js: raise SystemExit(f'Desktop navigation route missing: {route}')

          index=Path('index.html').read_text(encoding='utf-8')
          if index.index('morley-desktop-dashboard.css') < index.index('mobile-viewport-lock.css'):
              raise SystemExit('Desktop dashboard must load after the mobile viewport lock')
          if 'morley-desktop-dashboard.css?v=2' not in index:
              raise SystemExit('Desktop dashboard stylesheet cache version is stale')
          if 'morley-desktop-dashboard.js?v=1' not in index:
              raise SystemExit('Desktop dashboard behaviour is not loaded')

          loader=Path('mobile-menu-theme-lock.css').read_text(encoding='utf-8')
          if 'web-apk-light-visual-lock.css?v=20260902-3' not in loader:
              raise SystemExit('Final visual lock cache version is stale')
          print('Morley emerald, desktop dashboard, and mobile preservation contracts verified')
          PY
      - name: Desktop dashboard regression test
        run: node tests/desktop-dashboard-contract.test.js
