android:build-apk:
  stage: build
  tags:
    - morley-android
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - java -version
    - gradle --version
    - test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" || { echo 'Android SDK is required'; exit 1; }
    - python3 scripts/release_audit.py
    - |
      set -euo pipefail
      ZIP=morley_buys_login_bg_app_hq_new.zip
      if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app_hq.zip; fi
      if [ ! -f "$ZIP" ]; then ZIP=morley_buys_login_bg_app.zip; fi
      test -f "$ZIP" || { echo 'Missing Morley login video ZIP'; exit 1; }
      rm -rf .tmp/morley-login-video
      mkdir -p .tmp/morley-login-video android/app/src/main/res/raw web-assets
      unzip -q -o "$ZIP" -d .tmp/morley-login-video
      VIDEO_PATH="$(find .tmp/morley-login-video -type f -iname '*.mp4' | head -n 1)"
      test -n "$VIDEO_PATH" && test -s "$VIDEO_PATH"
      EXPECTED_BYTES=22004826
      EXPECTED_SHA256=2bdeb6b7add8fda997144483534d3e8b3257079c2d3932ee5c8ff5d70720b897
      test "$(stat -c%s "$VIDEO_PATH")" = "$EXPECTED_BYTES"
      test "$(sha256sum "$VIDEO_PATH" | awk '{print $1}')" = "$EXPECTED_SHA256"
      cp "$VIDEO_PATH" android/app/src/main/res/raw/morley_buys_login_bg_app.mp4
      cp "$VIDEO_PATH" web-assets/morley_buys_login_bg_app.mp4
    - |
      if [ -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]; then
        printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
      elif [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        cat > android/app/google-services.json <<'JSON'
      {
        "project_info":{"project_number":"123456789012","project_id":"morley-ci-placeholder","storage_bucket":"morley-ci-placeholder.appspot.com"},
        "client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0000000000000000","android_client_info":{"package_name":"com.buysloans.hub"}},"api_key":[{"current_key":"AIzaSyMorleyCiPlaceholderKey000000000"}]}],
        "configuration_version":"1"
      }
      JSON
      else
        echo 'FIREBASE_GOOGLE_SERVICES_JSON is required for default-branch release builds' >&2
        exit 1
      fi
      python3 -m json.tool android/app/google-services.json >/dev/null
    - gradle -p android testDebugUnitTest --stacktrace --console=plain
    - gradle -p android lintDebug --stacktrace --console=plain
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        gradle -p android assembleDebug --stacktrace --console=plain
        mkdir -p dist
        cp android/app/build/outputs/apk/debug/app-debug.apk dist/B-and-L-Morley-debug.apk
        sha256sum dist/B-and-L-Morley-debug.apk > dist/B-and-L-Morley-debug.apk.sha256
      else
        test -n "${BL_KEYSTORE_BASE64:-}" || { echo 'BL_KEYSTORE_BASE64 is required'; exit 1; }
        test -n "${BL_KEYSTORE_PASSWORD:-}" || { echo 'BL_KEYSTORE_PASSWORD is required'; exit 1; }
        test -n "${BL_KEY_ALIAS:-}" || { echo 'BL_KEY_ALIAS is required'; exit 1; }
        mkdir -p .tmp dist
        KEYSTORE_PATH="$CI_PROJECT_DIR/.tmp/bl-morley-release.jks"
        printf '%s' "$BL_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
        keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BL_KEYSTORE_PASSWORD" -alias "$BL_KEY_ALIAS" >/dev/null
        export B_AND_L_KEYSTORE_PATH="$KEYSTORE_PATH"
        export B_AND_L_STORE_PASSWORD="$BL_KEYSTORE_PASSWORD"
        export B_AND_L_KEY_ALIAS="$BL_KEY_ALIAS"
        gradle -p android assembleRelease --stacktrace --console=plain
        VERSION="$(python3 - <<'PY'
      import re
      from pathlib import Path
      text=Path('android/app/build.gradle').read_text(encoding='utf-8')
      m=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]",text)
      if not m: raise SystemExit('Missing versionName')
      print(re.sub(r'[^A-Za-z0-9._-]+','-',m.group(1)).strip('-'))
      PY
      )"
        cp android/app/build/outputs/apk/release/app-release.apk "dist/B-and-L-Morley-${VERSION}.apk"
        EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
        APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        test -n "$APKSIGNER"
        SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "dist/B-and-L-Morley-${VERSION}.apk")"
        ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
        test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
        unzip -l "dist/B-and-L-Morley-${VERSION}.apk" > .tmp/apk-contents.txt
        PACKAGED_PATH="$(awk '$1 == 22004826 && $4 ~ /^res\/.*\.mp4$/ {print $4; exit}' .tmp/apk-contents.txt)"
        test -n "$PACKAGED_PATH"
        unzip -p "dist/B-and-L-Morley-${VERSION}.apk" "$PACKAGED_PATH" > .tmp/packaged-login.mp4
        test "$(sha256sum .tmp/packaged-login.mp4 | awk '{print $1}')" = '2bdeb6b7add8fda997144483534d3e8b3257079c2d3932ee5c8ff5d70720b897'
        sha256sum "dist/B-and-L-Morley-${VERSION}.apk" > "dist/B-and-L-Morley-${VERSION}.apk.sha256"
      fi
  artifacts:
    expire_in: 14 days
    paths:
      - dist/*.apk
      - dist/*.apk.sha256

android:nova-apk-build:
  stage: build
  tags:
    - morley-android
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - java -version
    - gradle --version
    - test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" || { echo 'Android SDK is required'; exit 1; }
    - gradle -p android :novaapp:testDebugUnitTest :novaapp:lintDebug --stacktrace --console=plain
    - |
      VERSION_NAME="$(python3 - <<'PY'
      import re
      from pathlib import Path
      text=Path('android/novaapp/build.gradle').read_text(encoding='utf-8')
      m=re.search(r"\bversionName\s+['\"]([^'\"]+)['\"]", text)
      if not m: raise SystemExit('Missing Nova versionName')
      print(m.group(1))
      PY
      )"
      SAFE="$(printf '%s' "$VERSION_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g')"
      mkdir -p dist
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        gradle -p android :novaapp:assembleDebug --stacktrace --console=plain
        FILE="Nova-AI-${SAFE}-debug.apk"
        cp android/novaapp/build/outputs/apk/debug/novaapp-debug.apk "dist/$FILE"
      else
        test -n "${BL_KEYSTORE_BASE64:-}" || { echo 'BL_KEYSTORE_BASE64 is required'; exit 1; }
        test -n "${BL_KEYSTORE_PASSWORD:-}" || { echo 'BL_KEYSTORE_PASSWORD is required'; exit 1; }
        test -n "${BL_KEY_ALIAS:-}" || { echo 'BL_KEY_ALIAS is required'; exit 1; }
        mkdir -p .tmp
        KEYSTORE_PATH="$CI_PROJECT_DIR/.tmp/nova-release.jks"
        printf '%s' "$BL_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
        keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BL_KEYSTORE_PASSWORD" -alias "$BL_KEY_ALIAS" >/dev/null
        export B_AND_L_KEYSTORE_PATH="$KEYSTORE_PATH"
        export B_AND_L_STORE_PASSWORD="$BL_KEYSTORE_PASSWORD"
        export B_AND_L_KEY_ALIAS="$BL_KEY_ALIAS"
        gradle -p android :novaapp:assembleRelease --stacktrace --console=plain
        FILE="Nova-AI-${SAFE}.apk"
        cp android/novaapp/build/outputs/apk/release/novaapp-release.apk "dist/$FILE"
        EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
        APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        test -n "$APKSIGNER"
        SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "dist/$FILE")"
        ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
        test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      fi
      sha256sum "dist/$FILE" > "dist/$FILE.sha256"
      sha256sum --check "dist/$FILE.sha256"
  artifacts:
    expire_in: 14 days
    paths:
      - dist/Nova-AI-*.apk
      - dist/Nova-AI-*.apk.sha256
