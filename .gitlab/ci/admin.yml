.admin-parity-blocked:
  stage: test
  image: node:22-bookworm
  script:
    - echo "MIGRATION BLOCKED — Admin parity command set has not been fully ported yet."
    - exit 1

admin:android-check:
  extends: .admin-parity-blocked

admin:control-integration:
  extends: .admin-parity-blocked

admin:recovery-apk:
  extends: .admin-parity-blocked

admin:release-check:
  extends: .admin-parity-blocked

admin:apk-build:
  stage: build
  tags:
    - morley-android
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - java -version
    - gradle --version
    - test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
    - gradle -p android :adminapp:testDebugUnitTest :adminapp:lintDebug
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        gradle -p android :adminapp:assembleDebug
        mkdir -p dist
        cp android/adminapp/build/outputs/apk/debug/adminapp-debug.apk dist/Morley-Admin-readonly.apk
      else
        test -n "${BL_KEYSTORE_BASE64:-}" || { echo 'BL_KEYSTORE_BASE64 is required'; exit 1; }
        test -n "${BL_KEYSTORE_PASSWORD:-}" || { echo 'BL_KEYSTORE_PASSWORD is required'; exit 1; }
        test -n "${BL_KEY_ALIAS:-}" || { echo 'BL_KEY_ALIAS is required'; exit 1; }
        mkdir -p .tmp dist
        KEYSTORE_PATH="$CI_PROJECT_DIR/.tmp/bl-morley-admin-release.jks"
        printf '%s' "$BL_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
        keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BL_KEYSTORE_PASSWORD" -alias "$BL_KEY_ALIAS" >/dev/null
        export B_AND_L_KEYSTORE_PATH="$KEYSTORE_PATH"
        export B_AND_L_STORE_PASSWORD="$BL_KEYSTORE_PASSWORD"
        export B_AND_L_KEY_ALIAS="$BL_KEY_ALIAS"
        gradle -p android :adminapp:assembleRelease
        cp android/adminapp/build/outputs/apk/release/adminapp-release.apk dist/Morley-Admin-readonly.apk
        EXPECTED_CERT_SHA256=c919385ba51d241cd932b44c1fcfcda48529aef5fd4dda0f3b5f8c5f6056ab7b
        APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        test -n "$APKSIGNER"
        SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/Morley-Admin-readonly.apk)"
        ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n -E 's/^(V2 Signer: |Signer #1 )?certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
        test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      fi
    - sha256sum dist/Morley-Admin-readonly.apk > dist/Morley-Admin-readonly.apk.sha256
    - sha256sum --check dist/Morley-Admin-readonly.apk.sha256
  artifacts:
    expire_in: 14 days
    paths:
      - dist/Morley-Admin-readonly.apk
      - dist/Morley-Admin-readonly.apk.sha256
