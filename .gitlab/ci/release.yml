.release-parity-blocked:
  stage: release-check
  image: node:22-bookworm
  script:
    - echo "MIGRATION BLOCKED — Release/OTA parity command set has not been fully ported yet."
    - exit 1

release:nova-ota-metadata-contract:
  extends: .release-parity-blocked

release:ota-version-policy:
  extends: .release-parity-blocked

release:admin-ota-feed-deploy:
  extends: .release-parity-blocked
  when: manual
  allow_failure: true

release:auto-ota:
  extends: .release-parity-blocked
  when: manual
  allow_failure: true

release:deploy-admin-pages:
  extends: .release-parity-blocked
  when: manual
  allow_failure: true

release:publish-2-12-0:
  extends: .release-parity-blocked
  when: manual
  allow_failure: true
