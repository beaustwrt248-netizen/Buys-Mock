test:web-no-blue-filter:
  extends: .node-python-job
  script:
    - node tests/desktop-dashboard-contract.test.js
    - node --test tests/mobile-app-parity-v4.test.js
    - node --test tests/mobile-app-parity-v5.test.js
    - |
      python3 - <<'PY'
      from pathlib import Path
      forbidden=['#2f7cff','#1f5fd8','#12c9ff','#2468dd','#2875ff','#16c7ff','#70dfff','#7bdfff','rgba(47,124,255','rgba(18,201,255','rgb(47,124,255','rgb(18,201,255']
      active=['cyber-ui.css','cyber-spectrum.css','reference-theme.css','morley-light-web.css','web-apk-light-visual-lock.css','mobile-menu-theme-lock.css','morley-desktop-dashboard.css','mobile-app-parity-v4.css','mobile-app-parity-v5.css']
      failures=[]
      for file in active:
          text=Path(file).read_text(encoding='utf-8').lower(); found=[token for token in forbidden if token in text]
          if found: failures.append(f'{file}: {", ".join(found)}')
      if failures: raise SystemExit('Retired electric blue/cyan theme token detected:\n'+'\n'.join(failures))
      for legacy in ['cyber-ui.css','cyber-spectrum.css','reference-theme.css']:
          if 'Retired production theme shim' not in Path(legacy).read_text(encoding='utf-8'): raise SystemExit(f'{legacy} must remain retired and neutral')
      mobile=Path('mobile-viewport-lock.css').read_text(encoding='utf-8')
      for needle in ['html.morley-physical-phone','max-height:60px','grid-template-columns:repeat(4,minmax(0,1fr))','padding-bottom:calc(82px + env(safe-area-inset-bottom))']:
          if needle not in mobile: raise SystemExit('Mobile contract missing: '+needle)
      lock=Path('web-apk-light-visual-lock.css').read_text(encoding='utf-8')
      for needle in ['#inventory #addItem','#scanner #startScan','#scanner #findCode','#morleyMenuDialog button','#morleyMoreBackBar button','nav[aria-label="Primary navigation"]','button.secondary','button.danger']:
          if needle not in lock: raise SystemExit('Shared component coverage missing: '+needle)
      desktop=Path('morley-desktop-dashboard.css').read_text(encoding='utf-8')
      for needle in ['@media (min-width:1000px)','#morleyDesktopShell','margin:0 0 0 272px','--morley-dash-emerald','#home>.stats','.desktop-more-grid','table{width:100%','#morleyMenuTrigger','.desktop-header-actions{display:none!important','.msi-fill{background:linear-gradient(90deg,#087a55','.desktop-side-status{margin-top:auto!important','.morley-dashboard-nav-icon svg{display:block!important','#desktopPricingState','color:#7fe2bb!important','.morley-web-signout{background:#b44552!important','.morley-menu-signout{background:#b44552!important']:
          if needle not in desktop: raise SystemExit('Desktop finance dashboard contract missing: '+needle)
      if '@media (max-width:760px)' in desktop: raise SystemExit('Desktop dashboard must not override the <=760px mobile contract')
      dashboard_js=Path('morley-desktop-dashboard.js').read_text(encoding='utf-8')
      for route in ['Dashboard','Universal Search','Categories','General Buys','Saved Deals','Inventory','Scanner','Sales','More']:
          if route not in dashboard_js: raise SystemExit(f'Desktop navigation route missing: {route}')
      for category in ['Laptops','Desktops','Mobile Phones','Gaming Consoles']:
          if category not in dashboard_js: raise SystemExit(f'Desktop Categories destination missing: {category}')
      for retired in ["['phones',","['computer',","['console',"]:
          if retired in dashboard_js: raise SystemExit(f'Retired top-level desktop pricing route returned: {retired}')
      if "home|categories|general|settings" not in dashboard_js: raise SystemExit('Desktop primary navigation contract missing')
      index=Path('index.html').read_text(encoding='utf-8')
      if index.index('morley-desktop-dashboard.css') < index.index('mobile-viewport-lock.css'): raise SystemExit('Desktop dashboard must load after mobile lock')
      for needle in ['morley-desktop-dashboard.css?v=2','quick-deal-grade.js?v=3','morley-desktop-dashboard.js?v=2','morley-light-web.css?v=2']:
          if needle not in index: raise SystemExit('Required cache/version contract missing: '+needle)
      if index.index('mobile-app-parity-v5.css?v=202609072') < index.index('mobile-app-parity-v4.css?v=202609044'): raise SystemExit('Mobile parity v5 stylesheet must load after v4')
      if index.index('mobile-app-parity-v5.js?v=202609041&route=2') < index.index('mobile-app-parity-v4.js?v=202609044'): raise SystemExit('Mobile parity v5 runtime must load after v4')
      auth_theme=Path('morley-light-web.css').read_text(encoding='utf-8')
      for needle in ['#morleyWebAuth video{opacity:.82!important','brightness(.82)','rgba(5,24,18,.38)','background:rgba(255,255,255,.90)']:
          if needle not in auth_theme: raise SystemExit('Login video visibility contract missing: '+needle)
      loader=Path('mobile-menu-theme-lock.css').read_text(encoding='utf-8')
      for needle in ['.morley-menu-dialog-close{','place-items:center!important','padding:0!important','line-height:1!important','#morleySessionSnapshot','#morleyNotificationStatus','#morleyDiagnosticsSnapshot','background:#edf5f1!important','#morleyWebDiagnostics .morley-settings-body button','#morleyWebDiagnostics .morley-settings-body button:disabled','-webkit-text-fill-color:#fff!important','web-apk-light-visual-lock.css?v=20260902-3']:
          if needle not in loader: raise SystemExit('Dialog/visual lock contract missing: '+needle)
      smart=Path('smart-workspace.js').read_text(encoding='utf-8')
      for needle in ['function paintDealVerdict(panel,verdict)','#e7f6ee','#0f684c','#fff7dd','#755600','#fff0f1','#a83242',"verdict==='MARGINAL'?'warning'","verdict==='AVOID'?'danger'"]:
          if needle not in smart: raise SystemExit('Quick Deal verdict colour contract missing: '+needle)
      q=Path('quick-deal-grade.js').read_text(encoding='utf-8')
      for needle in ['MAX_BUY_FACTOR=Object.freeze({A:.70,B:.50,C:.30,Luxury:.70})','max.readOnly=true',"addEventListener('input',()=>syncMaxBuy(d))","addEventListener('change',()=>syncMaxBuy(d))"]:
          if needle not in q: raise SystemExit('Quick Deal grade/max-buy contract missing: '+needle)
      diagnostics=Path('web-diagnostics.js').read_text(encoding='utf-8')
      for needle in ['id="morleyDiagRefresh"','id="morleyDiagCopy"','color:#fff!important;-webkit-text-fill-color:#fff!important']:
          if needle not in diagnostics: raise SystemExit('Guardian diagnostics contrast missing: '+needle)
      PY

test:web-smoke:
  extends: .node-python-job
  script:
    - |
      python3 - <<'PY'
      import re
      from pathlib import Path
      root=Path('.')
      html=Path('index.html').read_text(encoding='utf-8')
      refs=re.findall(r'(?:href|src)=\\?"([^"?]+)',html)
      missing=[]
      for ref in refs:
          if ref.startswith(('http://','https://','data:','#')): continue
          if not (root/ref.lstrip('./')).exists(): missing.append(ref)
      if missing: raise SystemExit('Missing local assets: '+', '.join(missing))
      required=['secure-pricing.js','web-auth.js','signed-in-user.js','desktop-parity.js','smart-workspace.js','smart-workspace-plus.js','smart-insights.js','smart-input-polish.js','connection-status.js','web-diagnostics.js','menu-parity-polish.js','menu-dialog-a11y.js','web-notification-centre.js','web-display-parity.js','web-issue-report.js','reference-theme.css','no-gold.css','premium-motion.css','morley-light-web.css','admin/index.html','admin/browser-auth-bootstrap.js','admin/workspace.html','admin/workspace-template.html','admin/app.js','admin/styles.css','admin/invites.js','admin/targeted-notifications.js','admin/turnstile.html','admin/login-security.js']
      absent=[p for p in required if not Path(p).is_file()]
      if absent: raise SystemExit('Required production web assets missing: '+', '.join(absent))
      if 'no-gold.css' not in html or html.rfind('no-gold.css') < html.rfind('reference-theme.css'): raise SystemExit('no-gold.css load order invalid')
      if html.rfind('morley-light-web.css') < html.rfind('mobile-parity-v3.css'): raise SystemExit('morley-light-web.css must be final visual theme layer')
      for asset in ['secure-pricing.js','smart-workspace.js','smart-workspace-plus.js','smart-insights.js','smart-input-polish.js','connection-status.js','web-diagnostics.js','web-notification-centre.js','web-display-parity.js','web-issue-report.js']:
          if asset not in html: raise SystemExit('Production shell missing '+asset)
      if html.find('smart-workspace.js') > html.find('smart-workspace-plus.js'): raise SystemExit('smart-workspace.js must load before smart-workspace-plus.js')
      PY
    - |
      set -euo pipefail
      for file in secure-pricing.js app.js web-auth.js signed-in-user.js desktop-parity.js desktop-oem.js workflow.js smart-workspace.js smart-workspace-plus.js smart-insights.js smart-input-polish.js connection-status.js web-diagnostics.js menu-parity-polish.js menu-dialog-a11y.js account-refresh-parity.js web-notification-centre.js web-display-parity.js web-issue-report.js admin/browser-auth-bootstrap.js admin/app.js admin/invites.js admin/targeted-notifications.js admin/login-security.js; do test -s "$file"; node --check "$file"; done
    - python3 scripts/web_asset_cache_audit.py
    - |
      python3 - <<'PY'
      from pathlib import Path
