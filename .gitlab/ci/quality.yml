test:nova-next-ci:
  stage: test
  tags:
    - morley-android
  script:
    - node --version
    - java -version
    - gradle --version
    - node --test nova-next/tests/*.test.mjs
    - node --check nova-next/app.js
    - |
      set -euo pipefail
      while IFS= read -r -d '' file; do node --check "$file"; done < <(find nova-next/src -type f -name '*.mjs' -print0 | sort -z)
      grep -q "applicationId 'com.buysloans.novanext'" nova-next/android/app/build.gradle
      grep -q "applicationIdSuffix '.debug'" nova-next/android/app/build.gradle
      if grep -RIn "applicationId 'com.buysloans.nova'" nova-next/android; then exit 1; fi
      gradle --no-daemon --project-dir nova-next/android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --console=plain
      APK='nova-next/android/app/build/outputs/apk/debug/app-debug.apk'
      test -s "$APK"
      mkdir -p dist
      cp "$APK" dist/Nova-Next-0.1.0-dev-debug.apk
      (cd dist && sha256sum Nova-Next-0.1.0-dev-debug.apk > Nova-Next-0.1.0-dev-debug.apk.sha256 && sha256sum --check Nova-Next-0.1.0-dev-debug.apk.sha256)
  artifacts:
    expire_in: 14 days
    paths:
      - dist/Nova-Next-0.1.0-dev-debug.apk
      - dist/Nova-Next-0.1.0-dev-debug.apk.sha256

test:ui-consistency:
  extends: .node-python-job
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        mkdir -p .tmp
        python3 - <<'PY'
      import json, os
      from pathlib import Path
      payload={'pull_request':{'body':os.environ.get('CI_MERGE_REQUEST_DESCRIPTION',''),'base':{'sha':os.environ.get('CI_MERGE_REQUEST_DIFF_BASE_SHA','')},'head':{'sha':os.environ.get('CI_COMMIT_SHA','')}}}
      Path('.tmp/github-event.json').write_text(json.dumps(payload), encoding='utf-8')
      PY
        export GITHUB_EVENT_PATH="$CI_PROJECT_DIR/.tmp/github-event.json"
        python3 scripts/ui_pr_checklist_gate.py
      fi
    - node --check morley-ui-baseline.js
    - node --check mobile-readability-fix.js
    - node --check web-initial-render-fix.js
