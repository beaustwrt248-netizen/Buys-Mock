.node-python-job:
  stage: test
  image: node:22-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 curl unzip ca-certificates >/dev/null

validate:web-auth-origin:
  stage: validate
  image: node:22-bookworm
  script:
    - node tests/buyshub-web-auth-origin.test.js

validate:private-distribution-readiness:
  stage: validate
  image: python:3.12-bookworm
  script:
    - python3 scripts/build_private_distribution_readiness.py
    - cd dist/private-distribution-readiness && sha256sum --check SHA256SUMS && cd ../..
    - |
      set -euo pipefail
      python3 - <<'PY'
      import json
      from pathlib import Path
      root = Path('dist/private-distribution-readiness')
      inventory = json.loads((root / 'public-resource-dependencies.json').read_text(encoding='utf-8'))
      contract = json.loads((root / 'private-origin-contract.json').read_text(encoding='utf-8'))
      manifest = json.loads((root / 'distribution-manifest.json').read_text(encoding='utf-8'))
      deps = inventory['dependencies']
      assert inventory['blockingDependencyCount'] == len(deps)
      assert inventory['migrationReady'] == (len(deps) == 0)
      assert manifest['blockingPublicResourceCount'] == len(deps)
      assert manifest['migrationReady'] == inventory['migrationReady']
      assert inventory['repositoryVisibilityChanged'] is False
      assert inventory['liveOtaChanged'] is False
      assert contract['status'] == 'prepared-not-enabled'
      assert contract['requirements']['transport'] == 'https-only'
      assert contract['requirements']['secretsInClient'] is False
      assert contract['requirements']['serviceRoleInClient'] is False
      for dep in deps:
          assert dep['blockingPrivateRepositoryCutover'] is True
          assert str(dep['url']).startswith('https://')
      admin_update_source = 'android/adminapp/src/main/java/com/buysloans/admin/AdminUpdateManager.kt'
      assert any(dep['source'] == admin_update_source and dep['type'] == 'github_pages' for dep in deps)
      PY
    - |
      set -euo pipefail
      grep -q 'permissions:' .github/workflows/admin-apk-build.yml
      grep -q 'contents: read' .github/workflows/admin-apk-build.yml
      grep -q 'persist-credentials: false' .github/workflows/admin-apk-build.yml
      grep -q 'sha256sum --check dist/Morley-Admin-readonly.apk.sha256' .github/workflows/admin-apk-build.yml
      grep -q 'actions/upload-artifact@' .github/workflows/admin-apk-build.yml
      grep -q 'publish-admin-ota:' .github/workflows/admin-apk-build.yml
      grep -q 'contents: write' .github/workflows/admin-apk-build.yml
      grep -q 'releases/download' .github/workflows/admin-apk-build.yml
      ! grep -Eq 'raw\.githubusercontent\.com|github\.io' .github/workflows/admin-apk-build.yml
      grep -q 'raw.githubusercontent.com/beaustwrt248-netizen/Buys-Mock/main/ota/latest.json' admin/release-control.js
      python3 - <<'PY'
      import json
      from pathlib import Path
      data=json.loads(Path('ota/latest.json').read_text(encoding='utf-8'))
      assert str(data['apkUrl']).startswith('https://github.com/beaustwrt248-netizen/Buys-Mock/releases/download/')
      PY
  artifacts:
    expire_in: 14 days
    paths:
      - dist/private-distribution-readiness/

