plugins {
    id 'com.android.application'
}

def generatedNovaIconResDir = file("$buildDir/generated/novaIcon/res")
def generatedNovaIconFile = file("$buildDir/generated/novaIcon/res/drawable-nodpi/nova_official_app_icon.png")
def encodedNovaIconFile = file('src/main/nova_app_icon.b64')
def novaMainActivity = file('src/main/java/com/buysloans/nova/MainActivity.java')
def novaReferenceUiMarker = file("$buildDir/generated/novaReferenceUi/.prepared")

tasks.register('generateNovaAppIcon') {
    inputs.file(encodedNovaIconFile)
    outputs.file(generatedNovaIconFile)
    doLast {
        generatedNovaIconFile.parentFile.mkdirs()
        generatedNovaIconFile.bytes = Base64.decoder.decode(encodedNovaIconFile.text.replaceAll('\\s', ''))
    }
}

// Keep the approved visual reference reproducible at build time while the native UI remains programmatic.
// The source checkout is ephemeral in CI; this prepares the compiled source without changing auth or authority boundaries.
tasks.register('prepareNovaReferenceUi') {
    inputs.file(novaMainActivity)
    inputs.file(file('src/main/res/drawable-nodpi/nova_reference_brain.webp'))
    outputs.file(novaReferenceUiMarker)
    doLast {
        String source = novaMainActivity.getText('UTF-8')

        // Updates belong behind authenticated navigation, never on the sign-in screen.
        source = source.replace(
                '        addOtaSection();\n        footer();\n    }\n\n    private void showWorkspace()',
                '        footer();\n    }\n\n    private void showWorkspace()')

        // Use the approved brain artwork from the supplied reference, while retaining a live thinking pulse.
        source = source.replace(
                'import android.graphics.Canvas;\n',
                'import android.graphics.Bitmap;\nimport android.graphics.BitmapFactory;\nimport android.graphics.Canvas;\n')

        def brainPattern = ~/(?s)        @Override\n        protected void onDraw\(Canvas canvas\) \{.*?\n        \}\n\n        private int blend/
        String brainMethod = '''        @Override
        protected void onDraw(Canvas canvas) {
            super.onDraw(canvas);
            float w = getWidth();
            float h = getHeight();
            float cx = w / 2f;
            float cy = h / 2f;

            Bitmap reference = BitmapFactory.decodeResource(getResources(), R.drawable.nova_reference_brain);
            if (reference != null) {
                float horizontalInset = dp(MainActivity.this, 1);
                float verticalInset = dp(MainActivity.this, 1);
                RectF target = new RectF(horizontalInset, verticalInset, w - horizontalInset, h - verticalInset);
                paint.setStyle(Paint.Style.FILL);
                paint.setAlpha(255);
                paint.clearShadowLayer();
                canvas.drawBitmap(reference, null, target, paint);

                if (thinking) {
                    int pulse = blend(accent, pink, phase);
                    paint.setAlpha(185);
                    paint.setStyle(Paint.Style.STROKE);
                    paint.setStrokeWidth(dp(MainActivity.this, 2));
                    paint.setColor(pulse);
                    paint.setShadowLayer(dp(MainActivity.this, 13), 0, 0, pulse);
                    canvas.drawCircle(cx, cy, Math.min(w, h) * (.39f + .018f * phase), paint);
                    paint.clearShadowLayer();
                }
                paint.setAlpha(255);
                return;
            }

            float r = Math.min(w, h) * .40f;
            int pulse = thinking ? blend(accent, pink, phase) : blend(accent, violet, phase * .45f);
            paint.setStyle(Paint.Style.STROKE);
            paint.setStrokeCap(Paint.Cap.ROUND);
            paint.setColor(pulse);
            paint.setStrokeWidth(dp(MainActivity.this, 3));
            paint.setShadowLayer(dp(MainActivity.this, 18), 0, 0, pulse);
            canvas.drawCircle(cx, cy, r, paint);
            paint.clearShadowLayer();
        }

        private int blend'''
        source = brainPattern.matcher(source).replaceFirst(java.util.regex.Matcher.quoteReplacement(brainMethod))
        novaMainActivity.write(source, 'UTF-8')
        novaReferenceUiMarker.parentFile.mkdirs()
        novaReferenceUiMarker.text = 'prepared\n'
    }
}

android {
    namespace 'com.buysloans.nova'
    compileSdk 36

    defaultConfig {
        applicationId 'com.buysloans.nova'
        minSdk 29
        targetSdk 35
        versionCode 17
        versionName '0.3.13'
        buildConfigField 'String', 'OTA_MANIFEST_URL', '"https://raw.githubusercontent.com/beaustwrt248-netizen/Buys-Mock/main/nova/nova-update.json"'
        buildConfigField 'String', 'SUPABASE_URL', '"https://ghdhairijqjqivqriigi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt"'
        buildConfigField 'String', 'CAPTCHA_ORIGIN', '"https://buyshub.me/admin/"'
        buildConfigField 'String', 'TURNSTILE_SITE_KEY', '"0x4AAAAAAEZul-Qo6dqMim2U"'
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('B_AND_L_KEYSTORE_PATH')
            def storePass = System.getenv('B_AND_L_STORE_PASSWORD')
            def keyAliasEnv = System.getenv('B_AND_L_KEY_ALIAS')
            def keyPass = System.getenv('B_AND_L_KEY_PASSWORD') ?: storePass
            if (keyPath && storePass && keyAliasEnv) {
                storeFile file(keyPath)
                storePassword storePass
                keyAlias keyAliasEnv
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            res.srcDir generatedNovaIconResDir
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == 'preDebugBuild' || it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('generateNovaAppIcon')
    dependsOn tasks.named('prepareNovaReferenceUi')
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
