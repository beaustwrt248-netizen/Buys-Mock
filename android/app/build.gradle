    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { disable 'NullSafeMutableLiveData' }
    buildTypes { release { minifyEnabled false; shrinkResources false; if (hasReleaseSigning) { signingConfig signingConfigs.release } } }
}
def releaseStoreFileForCheck = System.getenv('B_AND_L_KEYSTORE_PATH'); def releaseStorePasswordForCheck = System.getenv('B_AND_L_STORE_PASSWORD'); def releaseKeyAliasForCheck = System.getenv('B_AND_L_KEY_ALIAS')
tasks.register('verifyReleaseSigning') { doLast { if (!releaseStoreFileForCheck || !releaseStorePasswordForCheck || !releaseKeyAliasForCheck) throw new GradleException('Production release signing is required. Configure B_AND_L_KEYSTORE_PATH, B_AND_L_STORE_PASSWORD and B_AND_L_KEY_ALIAS before building a release APK.'); if (!file(releaseStoreFileForCheck).exists()) throw new GradleException('Configured B&L Morley release keystore does not exist.') } }
tasks.register('integrateMarketplaceValuation', Exec) { workingDir rootProject.projectDir; commandLine 'python3', 'integrate_marketplace_valuation.py' }
