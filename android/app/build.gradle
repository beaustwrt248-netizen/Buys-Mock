plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.buysloans.hub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buysloans.hub'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '2.11.1-fullscreen-video'
        buildConfigField 'String', 'SUPABASE_URL', '"https://ghdhairijqjqivqriigi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt"'
        buildConfigField 'String', 'TURNSTILE_SITE_KEY', '"0x4AAAAAAEZul-Qo6dqMim2U"'
    }

    def releaseStoreFile = System.getenv('B_AND_L_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('B_AND_L_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('B_AND_L_KEY_ALIAS')
    def releaseKeyPassword = releaseStorePassword
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
        }
    }
}

def releaseStoreFileForCheck = System.getenv('B_AND_L_KEYSTORE_PATH')
def releaseStorePasswordForCheck = System.getenv('B_AND_L_STORE_PASSWORD')
def releaseKeyAliasForCheck = System.getenv('B_AND_L_KEY_ALIAS')

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseStoreFileForCheck || !releaseStorePasswordForCheck || !releaseKeyAliasForCheck) throw new GradleException('Production release signing is required. Configure B_AND_L_KEYSTORE_PATH, B_AND_L_STORE_PASSWORD and B_AND_L_KEY_ALIAS before building a release APK.')
        if (!file(releaseStoreFileForCheck).exists()) throw new GradleException('Configured B&L Morley release keystore does not exist.')
    }
}

tasks.register('applyCyberPalette', Exec) { workingDir rootProject.projectDir; commandLine 'python3', 'apply_cyber_palette.py' }
tasks.register('integrateMarketplaceValuation', Exec) { workingDir rootProject.projectDir; commandLine 'python3', 'integrate_marketplace_valuation.py' }
tasks.named('integrateMarketplaceValuation') { mustRunAfter tasks.named('applyCyberPalette') }
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('applyCyberPalette')
    dependsOn tasks.named('integrateMarketplaceValuation')
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn tasks.named('verifyReleaseSigning') }

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}