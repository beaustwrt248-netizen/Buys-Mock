plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.buysloans.hub'
    compileSdk 37
    defaultConfig {
        applicationId 'com.buysloans.hub'
        minSdk 26
        targetSdk 36
        versionCode 115
        versionName '2.15.71'
        buildConfigField 'String', 'SUPABASE_URL', '"https://ghdhairijqjqivqriigi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt"'
        buildConfigField 'String', 'TURNSTILE_SITE_KEY', '"0x4AAAAAAEZul-Qo6dqMim2U"'
    }
    def releaseStoreFile = System.getenv('B_AND_L_KEYSTORE_PATH'); def releaseStorePassword = System.getenv('B_AND_L_STORE_PASSWORD'); def releaseKeyAlias = System.getenv('B_AND_L_KEY_ALIAS'); def releaseKeyPassword = releaseStorePassword; def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias
    signingConfigs { if (hasReleaseSigning) { release { storeFile file(releaseStoreFile); storePassword releaseStorePassword; keyAlias releaseKeyAlias; keyPassword releaseKeyPassword } } }
    buildFeatures { compose true; buildConfig true }
