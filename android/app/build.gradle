plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.buysloans.hub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buysloans.hub'
        minSdk 26
        targetSdk 35
        versionCode 94
        versionName '2.15.50'
        buildConfigField 'String', 'SUPABASE_URL', '"https://ghdhairijqjqivqriigi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt"'
        buildConfigField 'String', 'TURNSTILE_SITE_KEY', '"0x4AAAAAAEZul-Qo6dqMim2U"'
    }

    def releaseStoreFile = System.getenv('B_AND_L_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('B_AND_L_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('B_AND_L_KEY_ALIAS')
    def releaseKeyPassword = releaseStorePassword
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    lint { disable 'NullSafeMutableLiveData' }

    buildTypes {
        debug {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE',
            'META-INF/LICENSE.txt',
            'META-INF/NOTICE',
            'META-INF/NOTICE.txt'
        ]
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.firebase:firebase-auth-ktx:23.2.0'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.1'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:3.1.4'
    implementation 'io.github.jan-tennert.supabase:auth-kt:3.1.4'
    implementation 'io.ktor:ktor-client-okhttp:3.1.1'
    implementation 'io.ktor:ktor-client-content-negotiation:3.1.1'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'
}
