plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.buysloans.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buysloans.admin'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.1.15'
        buildConfigField 'String', 'SUPABASE_URL', '"https://ghdhairijqjqivqriigi.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_ch49o8WRnDb8pPzowZH3Tg_XZcIbgvt"'
    }

    def releaseStoreFile = System.getenv('B_AND_L_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('B_AND_L_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('B_AND_L_KEY_ALIAS')
    def releaseKeyPassword = releaseStorePassword
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    lint {
        disable 'NullSafeMutableLiveData'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
        }
    }
}

def releaseStoreFileForCheck = System.getenv('B_AND_L_KEYSTORE_PATH')
def releaseStorePasswordForCheck = System.getenv('B_AND_L_STORE_PASSWORD')
def releaseKeyAliasForCheck = System.getenv('B_AND_L_KEY_ALIAS')

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseStoreFileForCheck || !releaseStorePasswordForCheck || !releaseKeyAliasForCheck) throw new GradleException('Stable Admin release signing is required.')
        if (!file(releaseStoreFileForCheck).exists()) throw new GradleException('Configured Admin release keystore does not exist.')
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn tasks.named('verifyReleaseSigning') }

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
